<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="../../src/core/sanitize.js"></script>
<script>
const zeilen = [];
let offen = '';

function abschnitt(name) { offen = name; zeilen.push(''); zeilen.push(name); }

function pruefe(was, bedingung, hinweis) {
  zeilen.push((bedingung ? 'ok   ' : 'FEHL ') + was + (bedingung ? '' : '  -> ' + hinweis));
}

/* Enthaelt das Ergebnis irgendetwas, was der Browser ausfuehren wuerde?
   Bewusst nicht nur nach "script" gesucht: gefaehrlich sind vor allem die
   Ereignis-Attribute, und die heissen alle on… */
function istHarmlos(html) {
  const t = document.createElement('template');
  t.innerHTML = html;
  for (const el of t.content.querySelectorAll('*')) {
    for (const a of el.attributes) {
      if (/^on/i.test(a.name)) return false;

      /* Ein href an einem <a> ist seit den Verweisen (ui/links.js)
         erlaubt – aber nur mit einem harmlosen Schema. Alles andere
         faellt weiter unter dieselbe Sperre wie vorher. */
      if (a.name.toLowerCase() === 'href' && el.tagName === 'A') {
        let schema = '';
        try { schema = new URL(a.value).protocol; } catch (e) { return false; }
        if (!['http:', 'https:', 'mailto:', 'inkwells:'].includes(schema)) return false;
        continue;
      }
      if (/^(src|href|srcset|formaction|data|xlink:href)$/i.test(a.name)) return false;
    }
    if (/^(SCRIPT|IFRAME|OBJECT|EMBED|IMG|SVG|LINK|META|FORM|INPUT|VIDEO|AUDIO)$/.test(el.tagName)) return false;
  }
  return true;
}

/* ── 1. Nichts Ausfuehrbares kommt durch ──────────────────────────── */

abschnitt('Angriffe');

const angriffe = [
  ['Bild mit onerror',        '<img src=x onerror="window.__BOOM=1">'],
  ['Script-Element',          '<script>window.__BOOM=1<\/script>'],
  ['SVG mit onload',          '<svg onload="window.__BOOM=1"></svg>'],
  ['onclick am Absatz',       '<p onclick="window.__BOOM=1">Text</p>'],
  ['iframe mit javascript:',  '<iframe src="javascript:window.__BOOM=1"></iframe>'],

  /* ── Verweise ────────────────────────────────────────────────────
     Ein <a href="https://…"> ist seit ui/links.js gewollt und steht
     deshalb weiter unten bei dem, was bleiben MUSS. Gefaehrlich ist
     allein die Adresse – und die kommt in allen Schreibweisen, die der
     Browser als dasselbe liest. Genau deshalb prueft sanitize.js ueber
     den URL-Parser und nicht mit einem eigenen Ausdruck. */
  ['Verweis mit javascript:', '<a href="javascript:window.__BOOM=1">klick</a>'],
  ['Verweis JaVaScRiPt:',     '<a href="JaVaScRiPt:window.__BOOM=1">klick</a>'],
  ['Verweis mit Leerraum',    '<a href="  javascript:window.__BOOM=1">klick</a>'],
  ['Verweis mit Zeilenumbruch', '<a href="java\nscript:window.__BOOM=1">klick</a>'],
  ['Verweis mit data:',       '<a href="data:text/html,<script>window.__BOOM=1<\/script>">klick</a>'],
  ['Verweis mit vbscript:',   '<a href="vbscript:msgbox(1)">klick</a>'],
  ['Verweis auf eine Datei',  '<a href="file:///C:/Windows/system32">klick</a>'],
  ['Verweis mit onclick',     '<a href="https://ok.example" onclick="window.__BOOM=1">klick</a>'],
  ['style mit url()',         '<p style="background:url(https://boese.example/x)">Text</p>'],
  ['Formular',                '<form action="https://boese.example"><input name="a"></form>'],
  ['verschachtelt versteckt', '<div><b><img src=x onerror="window.__BOOM=1"></b></div>'],
  ['Grossschreibung',         '<IMG SRC=x ONERROR="window.__BOOM=1">'],
  ['data-Attribut',           '<p data-x="window.__BOOM=1">Text</p>']
];

for (const [name, roh] of angriffe) {
  const raus = sanitizePageHtml(roh);
  pruefe(name, istHarmlos(raus), JSON.stringify(raus));
}

// Und zwar wirklich: das Ergebnis ins Dokument haengen darf nichts ausloesen
const buehne = document.createElement('div');
document.body.appendChild(buehne);
for (const [, roh] of angriffe) buehne.innerHTML = sanitizePageHtml(roh);
pruefe('Eingesetzt loest nichts aus', !window.__BOOM, 'window.__BOOM wurde gesetzt');

/* ── 2. Der Editor-Text bleibt unversehrt ─────────────────────────── */

abschnitt('Was der Editor erzeugt');

function bleibt(name, roh, muss) {
  const raus = sanitizePageHtml(roh);
  pruefe(name, muss.every(m => raus.includes(m)), JSON.stringify(raus));
}

bleibt('Absatz',              '<p>Hallo Welt</p>', ['<p>', 'Hallo Welt']);
bleibt('Fett',                '<p><b>fett</b></p>', ['<b>', 'fett']);
bleibt('Kursiv',              '<p><i>kursiv</i></p>', ['<i>', 'kursiv']);
bleibt('Unterstrichen',       '<p><u>unter</u></p>', ['<u>', 'unter']);
bleibt('Ueberschrift H1',     '<p class="j-title-1">Titel</p>', ['j-title-1', 'Titel']);
bleibt('Ueberschrift H2',     '<p class="j-title-2">Titel</p>', ['j-title-2']);
bleibt('Echtes h1',           '<h1>Titel</h1>', ['<h1>', 'Titel']);
bleibt('Zeilenumbruch',       'a<br>b', ['<br>']);
bleibt('Farbe als font',      '<font color="#c04040">rot</font>', ['color="#c04040"', 'rot']);
bleibt('Farbe als style',     '<span style="color:#2a5fa8">blau</span>', ['color', 'blau']);
bleibt('Farbe rgb()',         '<span style="color:rgb(192,64,64)">rot</span>', ['color', 'rot']);
bleibt('Einrueckung/Leerraum','<p>  zwei Leerzeichen</p>', ['zwei Leerzeichen']);

/* Verweise. Sie standen frueher unter „Angriffe" und wurden komplett
   ausgepackt – seit ui/links.js gehoeren sie dazu. Der Text muss auch
   dann stehen bleiben, wenn die Adresse durchfaellt. */
bleibt('Verweis https',       '<a href="https://inkwells.me">Inkwells</a>',
  ['<a', 'href="https://inkwells.me', 'Inkwells']);
bleibt('Verweis http',        '<a href="http://example.org/x?y=1">Text</a>', ['href="http://example.org']);
bleibt('Verweis mailto',      '<a href="mailto:wer@example.org">Mail</a>', ['href="mailto:']);
bleibt('Verweis inkwells',     '<a href="inkwells://share/abc">Heft</a>', ['href="inkwells://share/abc']);
bleibt('Verweis mit target',  '<a href="https://a.example" target="_blank" rel="noopener noreferrer">x</a>',
  ['target="_blank"', 'rel="noopener noreferrer"']);

const rausBoeserVerweis = sanitizePageHtml('<a href="javascript:alert(1)">wichtiger Text</a>');
pruefe('Bei schlechter Adresse bleibt der Text',
  rausBoeserVerweis.includes('wichtiger Text') && !rausBoeserVerweis.includes('javascript'),
  JSON.stringify(rausBoeserVerweis));

const rausFremdesTarget = sanitizePageHtml('<a href="https://a.example" target="_parent">x</a>');
pruefe('Ein anderes target faellt weg',
  !rausFremdesTarget.includes('_parent'), JSON.stringify(rausFremdesTarget));
bleibt('Verschachtelt',       '<p><b><i>beides</i></b></p>', ['<b>', '<i>', 'beides']);

/* Die Form einer Aufzaehlung haengt an der Klasse (core/lists.js).
   Faellt sie hier weg, sieht eine Liste aus einem geteilten Heft nach
   dem Oeffnen anders aus als beim Schreiben. */
bleibt('Aufzaehlung',         '<ul class="j-list-disc"><li>eins</li></ul>', ['<ul', '<li>', 'j-list-disc', 'eins']);
bleibt('Strich-Aufzaehlung',  '<ul class="j-list-dash"><li>x</li></ul>', ['j-list-dash']);
bleibt('Nummerierung',        '<ol class="j-list-decimal"><li>eins</li></ol>', ['<ol', 'j-list-decimal']);
bleibt('Buchstaben',          '<ol class="j-list-lower-alpha"><li>a</li></ol>', ['j-list-lower-alpha']);
bleibt('Klammern',            '<ol class="j-list-alpha-paren"><li>a</li></ol>', ['j-list-alpha-paren']);
bleibt('Roemisch',            '<ol class="j-list-upper-roman"><li>I</li></ol>', ['j-list-upper-roman']);
bleibt('Verschachtelte Liste','<ul class="j-list-disc"><li>a<ul class="j-list-circle"><li>b</li></ul></li></ul>',
  ['j-list-disc', 'j-list-circle', 'b']);

const rausFremdeKlasse = sanitizePageHtml('<ul class="j-list-disc boese"><li>x</li></ul>');
pruefe('Fremde Klasse an der Liste faellt weg',
  rausFremdeKlasse.includes('j-list-disc') && !rausFremdeKlasse.includes('boese'),
  JSON.stringify(rausFremdeKlasse));

/* ══════════════════════════════════════════════════════════════════
   TABELLEN MUESSEN GANZ DURCHKOMMEN

   Hier stand die Gegenprobe: eine Tabelle galt als fremdes Element und
   wurde ausgepackt – der Text blieb, das Geruest fiel weg. Seit es
   Tabellen im Editor gibt (core/tables.js), ist genau das der Fehler:
   die erste Aenderung, die durch den Abgleich geht, machte aus einer
   Tabelle eine Reihe loser Woerter, und zurueck geht das nicht.
   ══════════════════════════════════════════════════════════════════ */
abschnitt('Tabellen bleiben Tabellen');

const tabelle = sanitizePageHtml(
  '<table class="j-table"><tbody><tr><th>Kopf</th></tr>'
  + '<tr><td colspan="2">Zelle</td></tr></tbody></table>');
pruefe('Das Geruest bleibt stehen',
  /<table[^>]*>[\s\S]*<tbody>[\s\S]*<tr>[\s\S]*<th>[\s\S]*<td/.test(tabelle),
  JSON.stringify(tabelle));
pruefe('Mit seiner Klasse', tabelle.includes('j-table'), JSON.stringify(tabelle));
pruefe('Und verbundene Zellen bleiben verbunden',
  tabelle.includes('colspan="2"'), JSON.stringify(tabelle));

const boeseZelle = sanitizePageHtml(
  '<table><tr><td onclick="alert(1)" colspan="99999"><img src=x onerror=alert(1)>Zelle</td></tr></table>');
pruefe('Aber ohne Handgriffe daran',
  !/onclick/i.test(boeseZelle) && !/<img/i.test(boeseZelle) && boeseZelle.includes('Zelle'),
  JSON.stringify(boeseZelle));
pruefe('Und ohne unsinnige Spannweite',
  !boeseZelle.includes('99999'), JSON.stringify(boeseZelle));

/* Die gezogenen Masse (core/tables.js): die Spaltenbreite an <col>, die
   Zeilenhoehe an <tr>. Beide muessen hier durchkommen, sonst waeren sie
   beim ersten Abgleich weg und die Tabelle spraenge auf ihre alten Masse
   zurueck. Ein style waere keine Alternative – davon bleibt unten allein
   die Farbe stehen. */
const gezogen = sanitizePageHtml(
  '<table class="j-table"><colgroup><col width="120"><col width="90"></colgroup>'
  + '<tbody><tr height="96"><td>a</td><td>b</td></tr></tbody></table>');
pruefe('Die gezogene Spaltenbreite bleibt',
  gezogen.includes('width="120"') && gezogen.includes('width="90"'), JSON.stringify(gezogen));
pruefe('Und die gezogene Zeilenhoehe auch',
  gezogen.includes('height="96"'), JSON.stringify(gezogen));

/* Nur eine nackte Zahl, und nur an den zwei Elementen, an denen sie
   etwas zu suchen hat. */
const boeseMasse = sanitizePageHtml(
  '<table><colgroup><col width="99999"></colgroup>'
  + '<tbody><tr height="expression(alert(1))"><td width="200" height="200">a</td></tr></tbody></table>');
pruefe('Unsinnige Masse fallen weg',
  !boeseMasse.includes('99999') && !/expression/i.test(boeseMasse),
  JSON.stringify(boeseMasse));
pruefe('Und an der Zelle gibt es sie gar nicht',
  !/width="200"/.test(boeseMasse) && !/height="200"/.test(boeseMasse),
  JSON.stringify(boeseMasse));

abschnitt('Text geht nie verloren');

const rausRahmen = sanitizePageHtml('<marquee>Zelle</marquee>');
pruefe('Verbotenes Element wird ausgepackt, Text bleibt',
  rausRahmen.includes('Zelle') && !/marquee/i.test(rausRahmen), JSON.stringify(rausRahmen));

const rausBild = sanitizePageHtml('<p>davor<img src=x onerror=alert(1)>danach</p>');
pruefe('Text um ein entferntes Bild herum bleibt',
  rausBild.includes('davor') && rausBild.includes('danach'), JSON.stringify(rausBild));

abschnitt('Randfaelle');

pruefe('Leer bleibt leer', sanitizePageHtml('') === '', 'nicht leer');
pruefe('null wird zu leer', sanitizePageHtml(null) === '', 'nicht leer');
pruefe('undefined wird zu leer', sanitizePageHtml(undefined) === '', 'nicht leer');
const zweimal = sanitizePageHtml(sanitizePageHtml('<p><b>x</b></p>'));
pruefe('Zweimal bereinigt aendert nichts mehr',
  zweimal === sanitizePageHtml('<p><b>x</b></p>'), zweimal);

/* ══════════════════════════════════════════════════════════════════════
   UND ZWAR BEI ALLEM — DARAN HAENGT DIE ZUSAMMENARBEIT

   In einem geteilten Heft ist das nicht bloss eine schoene Eigenschaft.
   ui/collab.js zieht den gemeinsamen Yjs-Stand nach, sobald die
   Bereinigung etwas geaendert hat, und schickt den Unterschied hinaus.
   Waere sanitizePageHtml KEIN Festpunkt, kaeme das nie zur Ruhe: jeder
   bereinigte den bereinigten Text des anderen erneut, und der Text
   flackerte zu zweit im Takt der Uebertragung hin und her.

   Deshalb hier ueber alles, was oben vorkommt – Angriffe wie
   Editor-Text. Nach dem ersten Durchgang darf sich nichts mehr ruehren.
   ══════════════════════════════════════════════════════════════════════ */
abschnitt('Bereinigen ist ein Festpunkt');

const festpunktFaelle = angriffe.map(([, roh]) => roh).concat([
  '<p>Hallo Welt</p>',
  '<p><b>fett</b><i>kursiv</i><u>unter</u></p>',
  '<h1>Ueberschrift</h1><h2>Zweite</h2>',
  '<ul><li>eins</li><li>zwei</li></ul>',
  '<ol><li>eins</li></ol>',
  '<a href="https://inkwells.me/x">Verweis</a>',
  '<p><span class="kommentar-mark" data-cid="k1">markiert</span></p>',
  '<table class="j-table"><tr><th>A</th><th>B</th></tr><tr><td>1</td><td>2</td></tr></table>',
  '<p>davor<img src="x" onerror="alert(1)">danach</p>',
  '<p style="text-align:center">mittig</p>',
  '<p><br></p>',
  '<div><b><i>verschachtelt</i></b></div>',
  '<p>Zeichen &amp; &lt; &gt; &quot; und ein Umlaut: äöü</p>',
  '<p>&nbsp;&nbsp;Abstand</p>'
]);

let wackelt = 0;
let wackelBeispiel = '';
for (const roh of festpunktFaelle) {
  const einmal = sanitizePageHtml(roh);
  const nochmal = sanitizePageHtml(einmal);
  if (einmal === nochmal) continue;
  wackelt++;
  if (!wackelBeispiel) {
    wackelBeispiel = JSON.stringify(roh) + ' → ' + JSON.stringify(einmal)
      + ' → ' + JSON.stringify(nochmal);
  }
}
pruefe('Der zweite Durchgang aendert bei keinem Fall etwas',
  wackelt === 0, wackelt + ' von ' + festpunktFaelle.length + ', z. B. ' + wackelBeispiel);

window.__ergebnis = zeilen.join('\n');
</script>
</body>
</html>
