/* Was docxImport.js aus der App erwartet. Mehr braucht es nicht – das
   Modul ist bewusst ohne Zugriff auf Zustand oder Oberfläche gebaut. */
const CFG = { PAGE_W: 794, PAGE_H: 1123, HDR: 58 };
function uid() { return 'x' + Math.random().toString(36).slice(2, 10); }
function makePage(bg) {
  return { id: uid(), date: new Date().toISOString(), bg: bg,
           textContent: '', inkStrokes: [], objects: [] };

<script>
const zeilen = [];
function abschnitt(name) { zeilen.push(''); zeilen.push(name); }
function pruefe(was, bedingung, hinweis) {
  zeilen.push((bedingung ? 'ok   ' : 'FEHL ') + was + (bedingung ? '' : '  -> ' + hinweis));
}

    const I = InkwellsDocxImport.__intern;
const I_PKG_REL = 'http://schemas.openxmlformats.org/package/2006/relationships';
const utf8 = (s) => new TextEncoder().encode(s);

/* ── Ein Archiv bauen, wie Word es schreibt ─────────────────────────
   core/docx.js legt alles ungepackt ab (Verfahren 0). Word packt
   (Verfahren 8). Der Leser muss beides können, also wird hier beides
   erzeugt – deflate über CompressionStream, das Gegenstück zu dem, was
   der Leser benutzt. */
function crc32(bytes) {
  let c, tabelle = [];
  for (let n = 0; n < 256; n++) {
    c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    tabelle[n] = c;
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = tabelle[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

async function packe(eintraege, gepackt) {
  const teile = [];
  const verzeichnis = [];
  let versatz = 0;

  for (const e of eintraege) {
    const name = utf8(e.name);
    const roh = e.data;
    const daten = gepackt
      ? new Uint8Array(await new Response(
          new Blob([roh]).stream().pipeThrough(new CompressionStream('deflate-raw'))
        ).arrayBuffer())
      : roh;
    const verfahren = gepackt ? 8 : 0;
    const crc = crc32(roh);

    const lokal = new Uint8Array(30 + name.length);
    const lv = new DataView(lokal.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, verfahren, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, daten.length, true);
    lv.setUint32(22, roh.length, true);
    lv.setUint16(26, name.length, true);
    lokal.set(name, 30);

    const zentral = new Uint8Array(46 + name.length);
    const zv = new DataView(zentral.buffer);
    zv.setUint32(0, 0x02014b50, true);
    zv.setUint16(4, 20, true);
    zv.setUint16(6, 20, true);
    zv.setUint16(8, 0x0800, true);
    zv.setUint16(10, verfahren, true);
    zv.setUint32(16, crc, true);
    zv.setUint32(20, daten.length, true);
    zv.setUint32(24, roh.length, true);
    zv.setUint16(28, name.length, true);
    zv.setUint32(42, versatz, true);
    zentral.set(name, 46);

    teile.push(lokal, daten);
    verzeichnis.push(zentral);
    versatz += lokal.length + daten.length;
  }

  const vzAnfang = versatz;
  let vzLaenge = 0;
  for (const z of verzeichnis) vzLaenge += z.length;

  const ende = new Uint8Array(22);
  const ev = new DataView(ende.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, verzeichnis.length, true);
  ev.setUint16(10, verzeichnis.length, true);
  ev.setUint32(12, vzLaenge, true);
  ev.setUint32(16, vzAnfang, true);

  let gesamt = 0;
  for (const t of [...teile, ...verzeichnis, ende]) gesamt += t.length;
  const aus = new Uint8Array(gesamt);
  let p = 0;
  for (const t of [...teile, ...verzeichnis, ende]) { aus.set(t, p); p += t.length; }
  return aus;
}

window.__fertig = (async function () {
  try {

    /* ══ 1. DAS ARCHIV ══════════════════════════════════════════════ */
    abschnitt('Das Archiv');

    const inhalt = '<w:p><w:r><w:t>Hallo</w:t></w:r></w:p>'.repeat(40);
    const eintraege = [
      { name: 'word/document.xml', data: utf8(inhalt) },
      { name: 'word/styles.xml', data: utf8('<styles/>') }
    ];

    for (const [name, gepackt] of [['gespeichert', false], ['deflate', true]]) {
      const archiv = await packe(eintraege, gepackt);
      const dateien = await I.entpacke(archiv);
      pruefe('Verfahren ' + name + ': beide Dateien da',
        dateien.size === 2 && dateien.has('word/document.xml'),
        [...dateien.keys()].join(','));
      pruefe('Verfahren ' + name + ': Inhalt unveraendert',
        I.alsText(dateien.get('word/document.xml')) === inhalt,
        I.alsText(dateien.get('word/document.xml')).slice(0, 40));
    }

    /* Ein Archiv mit Ordnereintrag – der hat keinen Inhalt und darf
       nicht als Datei auftauchen. */
    const mitOrdner = await packe([
      { name: 'word/', data: new Uint8Array(0) },
      { name: 'word/document.xml', data: utf8('<a/>') }
    ], true);
    const ohneOrdner = await I.entpacke(mitOrdner);
    pruefe('Ordnereintraege fallen weg', ohneOrdner.size === 1, [...ohneOrdner.keys()].join(','));

    /* Etwas, das kein ZIP ist, muss sauber scheitern statt Unsinn zu
       liefern – sonst sucht man den Fehler später im XML. */
    let sauberGescheitert = false;
    try { await I.entpacke(utf8('das ist kein Archiv')); }
    catch (e) { sauberGescheitert = e.message === 'NO_ZIP'; }
    pruefe('Eine Nicht-ZIP-Datei scheitert mit NO_ZIP', sauberGescheitert);

    /* ══ 2. DIE ÜBERSETZUNG ═════════════════════════════════════════ */
    abschnitt('Word-Bausteine');

    /* Ein Dokument bauen, wie Word es schreibt. Bewusst von Hand und
       nicht über core/docx.js: hier sollen gerade die Formen geprüft
       werden, die Inkwells selbst NIE erzeugt – ausdrückliches „nicht
       fett", Nummerierung über zwei Ecken, verbundene Zellen. */
    const NS = 'xmlns:w="' + I.W + '" xmlns:r="' + I.R + '"'
      + ' xmlns:a="' + I.A + '" xmlns:wp="' + I.WP + '"'
      + ' xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"'
      + ' xmlns:v="urn:schemas-microsoft-com:vml"'
      + ' xmlns:o="urn:schemas-microsoft-com:office:office"'
      + ' xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"'
      + ' xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"';

    async function lies(bodyXml, extra) {
      const teile = [
        { name: 'word/document.xml',
          data: utf8('<?xml version="1.0"?><w:document ' + NS + '><w:body>' + bodyXml + '</w:body></w:document>') }
      ];
      for (const [name, text] of Object.entries(extra || {})) {
        teile.push({ name, data: typeof text === 'string' ? utf8(text) : text });
      }
      return InkwellsDocxImport.lese(await packe(teile, true));
    }

    const htmlVon = (erg) => erg.bloecke.map(b => b.html).join('');

    // Überschriften über die Gliederungsebene, nicht über den Namen
    const vorlagen = '<?xml version="1.0"?><w:styles ' + NS + '>'
      + '<w:style w:type="paragraph" w:styleId="berschrift1">'
      + '<w:pPr><w:outlineLvl w:val="0"/></w:pPr></w:style>'
      + '<w:style w:type="paragraph" w:styleId="berschrift2">'
      + '<w:pPr><w:outlineLvl w:val="1"/></w:pPr></w:style>'
      + '<w:style w:type="paragraph" w:styleId="berschrift7">'
      + '<w:pPr><w:outlineLvl w:val="6"/></w:pPr></w:style></w:styles>';

    let e = await lies(
      '<w:p><w:pPr><w:pStyle w:val="berschrift1"/></w:pPr><w:r><w:t>Gross</w:t></w:r></w:p>'
      + '<w:p><w:pPr><w:pStyle w:val="berschrift2"/></w:pPr><w:r><w:t>Mittel</w:t></w:r></w:p>'
      + '<w:p><w:pPr><w:pStyle w:val="berschrift7"/></w:pPr><w:r><w:t>Tief</w:t></w:r></w:p>'
      + '<w:p><w:r><w:t>Normal</w:t></w:r></w:p>',
      { 'word/styles.xml': vorlagen });
    pruefe('Deutsche Vorlagennamen ergeben Ueberschriften',
      htmlVon(e) === '<h1>Gross</h1><h2>Mittel</h2><h3>Tief</h3><p>Normal</p>', htmlVon(e));
    pruefe('Tiefe Ebenen werden gemeldet', e.bericht.verloren.includes('tiefeUeberschriften'),
      e.bericht.verloren.join(','));

    // Auszeichnungen, samt ausdruecklichem "nicht fett"
    e = await lies(
      '<w:p><w:r><w:rPr><w:b/><w:i/></w:rPr><w:t>beides</w:t></w:r>'
      + '<w:r><w:rPr><w:b w:val="0"/></w:rPr><w:t>nicht fett</w:t></w:r>'
      + '<w:r><w:rPr><w:u w:val="single"/></w:rPr><w:t>unter</w:t></w:r>'
      + '<w:r><w:rPr><w:u w:val="none"/></w:rPr><w:t>ohne</w:t></w:r>'
      + '<w:r><w:rPr><w:strike/></w:rPr><w:t>durch</w:t></w:r>'
      + '<w:r><w:rPr><w:color w:val="C04040"/></w:rPr><w:t>rot</w:t></w:r>'
      + '<w:r><w:rPr><w:color w:val="auto"/></w:rPr><w:t>auto</w:t></w:r></w:p>');
    pruefe('Auszeichnungen und Farben',
      htmlVon(e) === '<p><b><i>beides</i></b>nicht fett<u>unter</u>ohne<s>durch</s>'
        + '<font color="#c04040">rot</font>auto</p>', htmlVon(e));

    // Ausrichtung
    e = await lies('<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:t>M</w:t></w:r></w:p>'
      + '<w:p><w:pPr><w:jc w:val="both"/></w:pPr><w:r><w:t>B</w:t></w:r></w:p>');
    pruefe('Ausrichtung kommt an',
      htmlVon(e) === '<p class="j-align-center">M</p><p class="j-align-justify">B</p>', htmlVon(e));

    // Listen ueber zwei Ecken, mit Unterebene
    const nummerierung = '<?xml version="1.0"?><w:numbering ' + NS + '>'
      + '<w:abstractNum w:abstractNumId="7">'
      + '<w:lvl w:ilvl="0"><w:numFmt w:val="decimal"/></w:lvl>'
      + '<w:lvl w:ilvl="1"><w:numFmt w:val="lowerLetter"/></w:lvl></w:abstractNum>'
      + '<w:num w:numId="3"><w:abstractNumId w:val="7"/></w:num></w:numbering>';
    const punkt = (txt, lvl) => '<w:p><w:pPr><w:numPr><w:ilvl w:val="' + lvl + '"/>'
      + '<w:numId w:val="3"/></w:numPr></w:pPr><w:r><w:t>' + txt + '</w:t></w:r></w:p>';

    e = await lies(punkt('eins', 0) + punkt('unter', 1) + punkt('zwei', 0),
      { 'word/numbering.xml': nummerierung });
    pruefe('Nummerierung mit Unterebene',
      htmlVon(e) === '<ol class="j-list-decimal"><li>eins<ol class="j-list-lower-alpha">'
        + '<li>unter</li></ol></li><li>zwei</li></ol>', htmlVon(e));
    pruefe('Eine Liste bleibt EIN Block', e.bloecke.length === 1, e.bloecke.length);

    // Tabelle mit verbundenen Zellen und Spaltenbreiten
    const zelle = (txt, extra) => '<w:tc><w:tcPr>' + (extra || '') + '</w:tcPr>'
      + '<w:p><w:r><w:t>' + txt + '</w:t></w:r></w:p></w:tc>';
    e = await lies('<w:tbl>'
      + '<w:tblGrid><w:gridCol w:w="1500"/><w:gridCol w:w="3000"/></w:tblGrid>'
      + '<w:tr><w:trPr><w:tblHeader/></w:trPr>' + zelle('A') + zelle('B') + '</w:tr>'
      + '<w:tr>' + zelle('hoch', '<w:vMerge w:val="restart"/>') + zelle('x') + '</w:tr>'
      + '<w:tr>' + zelle('', '<w:vMerge/>') + zelle('y') + '</w:tr>'
      + '<w:tr>' + zelle('breit', '<w:gridSpan w:val="2"/>') + '</w:tr></w:tbl>');
    const tHtml = htmlVon(e);
    pruefe('Spaltenbreiten als col width',
      tHtml.includes('<colgroup><col width="100"><col width="200"></colgroup>'), tHtml.slice(0, 90));
    pruefe('Kopfzeile wird th', tHtml.includes('<th>A</th><th>B</th>'), tHtml.slice(0, 160));
    pruefe('Zellen bleiben inline, ohne Absatz', !tHtml.includes('<p>'), tHtml.slice(0, 160));
    pruefe('Verbund ueber Zeilen wird rowspan', tHtml.includes('<td rowspan="2">hoch</td>'), tHtml);
    pruefe('Die Fortsetzung faellt weg',
      (tHtml.match(/<tr>/g) || []).length === 4 && !tHtml.includes('<td></td>'), tHtml);
    pruefe('Verbund ueber Spalten wird colspan', tHtml.includes('<td colspan="2">'), tHtml);

    // Leerzeilen bleiben stehen – in Word sind sie das Mittel fuer Abstand
    e = await lies('<w:p><w:r><w:t>a</w:t></w:r></w:p><w:p/><w:p><w:r><w:t>b</w:t></w:r></w:p>');
    pruefe('Leerzeilen bleiben', htmlVon(e) === '<p>a</p><p><br></p><p>b</p>', htmlVon(e));

    // Ein Link behaelt seinen Text, verliert aber die Adresse
    e = await lies('<w:p><w:hyperlink r:id="rId9"><w:r><w:t>Inkwells</w:t></w:r></w:hyperlink></w:p>');
    pruefe('Linktext bleibt, Adresse geht', htmlVon(e) === '<p>Inkwells</p>'
      && e.bericht.verloren.includes('links'), htmlVon(e));

    /* ══ 3. DER SANITIZER ═══════════════════════════════════════════ */
    abschnitt('Der Sanitizer');

    /* Alles, was hier erzeugt wird, muss ihn UNVERAENDERT ueberstehen.
       Sonst faellt es beim ersten Cloud-Abgleich weg – unbemerkt, denn
       auf dem eigenen Rechner sieht man es weiter. */
    const alles = await lies(
      '<w:p><w:pPr><w:pStyle w:val="berschrift1"/><w:jc w:val="center"/></w:pPr>'
      + '<w:r><w:t>Titel</w:t></w:r></w:p>'
      + '<w:p><w:r><w:rPr><w:b/><w:i/><w:u w:val="single"/><w:strike/>'
      + '<w:color w:val="2A5FA8"/></w:rPr><w:t>alles</w:t></w:r></w:p>'
      + punkt('Punkt', 0) + punkt('Unterpunkt', 1)
      + '<w:tbl><w:tblGrid><w:gridCol w:w="1500"/></w:tblGrid>'
      + '<w:tr>' + zelle('Z') + '</w:tr></w:tbl>',
      { 'word/styles.xml': vorlagen, 'word/numbering.xml': nummerierung });

    for (const block of alles.bloecke) {
      const nachher = sanitizePageHtml(block.html);
      pruefe('Ueberlebt den Sanitizer: ' + block.html.slice(0, 34).replace(/</g, '‹'),
        nachher === block.html, 'wurde zu: ' + nachher);
    }

    /* ══ 4. DER SEITENUMBRUCH ═══════════════════════════════════════ */
    abschnitt('Der Seitenumbruch');

    const P = InkwellsDocxPaginate;
    const NUTZ = P.nutzhoehe(1123);

    /** Wie hoch wird dieser Seiteninhalt wirklich? Mit echtem Satz. */
    function misstHoehe(html) {
      const { seite, feld } = P.__intern.baueMessplatz(794, 'ruled');
      feld.innerHTML = html;
      const h = feld.getBoundingClientRect().height;
      seite.remove();
      return h;
    }

    // 200 Absätze müssen auf mehrere Seiten gehen, ohne dass etwas fehlt
    const viele = [];
    for (let i = 1; i <= 200; i++) viele.push({ html: '<p>Absatz Nummer ' + i + '</p>' });
    let seitenListe = P.verteile(viele.slice(), { breite: 794, hoehe: 1123, bg: 'ruled' });

    pruefe('200 Absaetze ergeben mehrere Seiten', seitenListe.length > 1, seitenListe.length);
    pruefe('Keine Seite laeuft ueber',
      seitenListe.every(s => misstHoehe(s.html) <= NUTZ + 1),
      seitenListe.map(s => Math.round(misstHoehe(s.html))).join(','));

    const alleNummern = seitenListe.map(s => s.html).join('')
      .match(/Absatz Nummer (\d+)/g) || [];
    pruefe('Kein Absatz geht verloren', alleNummern.length === 200, alleNummern.length);
    pruefe('Die Reihenfolge stimmt',
      alleNummern[0] === 'Absatz Nummer 1' && alleNummern[199] === 'Absatz Nummer 200',
      alleNummern[0] + ' … ' + alleNummern[199]);

    // Ein ausdruecklicher Seitenumbruch schliesst die Seite sofort
    seitenListe = P.verteile([
      { html: '<p>vorn</p>' },
      { html: '<p>hinten</p>', umbruchDavor: true }
    ], { breite: 794, hoehe: 1123, bg: 'ruled' });
    pruefe('Ausdruecklicher Umbruch trennt',
      seitenListe.length === 2 && seitenListe[0].html.includes('vorn')
      && seitenListe[1].html.includes('hinten'),
      seitenListe.map(s => s.html).join(' || '));

    // Ein einzelner Absatz, der laenger ist als eine Seite, wird geteilt
    const langerText = 'Wort '.repeat(3000);
    seitenListe = P.verteile([{ html: '<p>' + langerText + '</p>' }],
      { breite: 794, hoehe: 1123, bg: 'ruled' });
    pruefe('Ein zu langer Absatz wird geteilt', seitenListe.length > 1, seitenListe.length);
    pruefe('Auch geteilt laeuft keine Seite ueber',
      seitenListe.every(s => misstHoehe(s.html) <= NUTZ + 1),
      seitenListe.map(s => Math.round(misstHoehe(s.html))).join(','));
    const woerterNachher = seitenListe.map(s => s.html).join(' ')
      .replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length;
    pruefe('Beim Teilen geht kein Wort verloren', woerterNachher === 3000, woerterNachher);

    // Auszeichnung ueberlebt das Teilen
    seitenListe = P.verteile([{ html: '<p><b>' + langerText + '</b></p>' }],
      { breite: 794, hoehe: 1123, bg: 'ruled' });
    pruefe('Fett bleibt auf beiden Haelften',
      seitenListe.every(s => s.html.includes('<b>')),
      seitenListe.map(s => s.html.slice(0, 30)).join(' || '));

    // Eine lange Tabelle wird nach Zeilen geteilt, mit Kopf auf beiden
    let tblHtml = '<table class="j-table"><tbody><tr><th>Nr</th><th>Wert</th></tr>';
    for (let i = 1; i <= 120; i++) tblHtml += '<tr><td>' + i + '</td><td>x</td></tr>';
    tblHtml += '</tbody></table>';
    seitenListe = P.verteile([{ html: tblHtml }], { breite: 794, hoehe: 1123, bg: 'ruled' });
    pruefe('Eine lange Tabelle wird geteilt', seitenListe.length > 1, seitenListe.length);
    pruefe('Die Kopfzeile steht auf jeder Seite',
      seitenListe.every(s => s.html.includes('<th>Nr</th>')),
      seitenListe.map(s => s.html.includes('<th>Nr</th>')).join(','));
    const zeilenNachher = (seitenListe.map(s => s.html).join('').match(/<td>\d+<\/td>/g) || []).length;
    pruefe('Keine Tabellenzeile geht verloren', zeilenNachher === 120, zeilenNachher);

    // Ein Bild-Platzhalter: die Stelle muss gemessen herauskommen
    seitenListe = P.verteile([
      { html: '<p>davor</p>' },
      { html: '<p><br></p>'.repeat(4), bild: { src: 'data:image/png;base64,x', w: 200, h: 120 } },
      { html: '<p>danach</p>' }
    ], { breite: 794, hoehe: 1123, bg: 'ruled' });
    const bild = seitenListe[0].bilder[0];
    pruefe('Das Bild bekommt eine Stelle', !!bild && bild.y > 0, JSON.stringify(bild));
    /* Eine Zeile „davor", dann der Platzhalter: das Bild gehoert unter
       die erste Zeile, also 64 (Textanfang) + 19 (Innenabstand) + 32. */
    pruefe('Die Stelle sitzt unter der ersten Zeile', bild && bild.y === 115, bild && bild.y);
    pruefe('Es steht am linken Textrand', bild && bild.x === 72, bild && bild.x);


    /* ══ 4b. BILDER UND HINTERGRÜNDE ═══════════════════════════════════
       Word hält Bilder auf drei Wegen, und lange kam nur der erste an:

         ein Bild je Zeichnung   DrawingML, der Normalfall
         mehrere je Zeichnung    eine Gruppe oder eine Zeichenfläche –
                                 davon wurde nur das erste genommen
         w:pict                  die alte VML-Form; sie wurde übersehen

       Dazu die beiden Hintergründe, die in Word HINTER dem Text liegen
       und deshalb keine gewöhnlichen Bilder sind. */
    abschnitt('Bilder und Hintergruende aus Word');

    const bildBytes = utf8('PNG-Platzhalter');

    /** Ein Dokument, bei dem auch vor dem Body etwas stehen darf. */
    async function liesRoh(vorBody, bodyXml, extra) {
      const teile = [
        { name: 'word/document.xml',
          data: utf8('<?xml version="1.0"?><w:document ' + NS + '>'
            + vorBody + '<w:body>' + bodyXml + '</w:body></w:document>') }
      ];
      for (const [name, wert] of Object.entries(extra || {})) {
        teile.push({ name, data: typeof wert === 'string' ? utf8(wert) : wert });
      }
      return InkwellsDocxImport.lese(await packe(teile, true));
    }

    const relsXml = (paare) =>
      '<?xml version="1.0"?><Relationships xmlns="' + I_PKG_REL + '">'
      + paare.map(([id, ziel]) => '<Relationship Id="' + id + '" Target="' + ziel + '"/>').join('')
      + '</Relationships>';

    // Eine Zeichnung mit DREI Bildern – so gruppiert Word eine Titelseite
    const gruppe = '<w:p><w:r><w:drawing><wp:inline>'
      + '<wp:extent cx="9525000" cy="9525000"/>'
      + '<pic:pic><pic:blipFill><a:blip r:embed="rId1"/></pic:blipFill>'
      + '<pic:spPr><a:xfrm><a:ext cx="952500" cy="476250"/></a:xfrm></pic:spPr></pic:pic>'
      + '<pic:pic><pic:blipFill><a:blip r:embed="rId2"/></pic:blipFill>'
      + '<pic:spPr><a:xfrm><a:ext cx="1905000" cy="952500"/></a:xfrm></pic:spPr></pic:pic>'
      + '<pic:pic><pic:blipFill><a:blip r:embed="rId3"/></pic:blipFill>'
      + '<pic:spPr><a:xfrm><a:ext cx="285750" cy="285750"/></a:xfrm></pic:spPr></pic:pic>'
      + '</wp:inline></w:drawing></w:r></w:p>';

    const dreiRels = relsXml([['rId1', 'media/a.png'], ['rId2', 'media/b.png'], ['rId3', 'media/c.png']]);
    const dreiDateien = {
      'word/_rels/document.xml.rels': dreiRels,
      'word/media/a.png': bildBytes,
      'word/media/b.png': bildBytes,
      'word/media/c.png': bildBytes
    };

    let erg = await liesRoh('', gruppe, dreiDateien);
    let mitBild = erg.bloecke.filter(b => b.bild);
    pruefe('Alle drei Bilder einer Gruppe kommen an', mitBild.length === 3,
      'gezaehlt: ' + mitBild.length);
    pruefe('Jedes ist ein eigenes Objekt mit eigener Quelle',
      new Set(mitBild.map(b => b.bild.src)).size === 1 && mitBild.length === 3,
      'dieselbe Datei dreimal ist hier richtig - gezaehlt: ' + mitBild.length);

    /* Das Mass steht am Bild selbst. Naehme man wp:extent, waere jedes
       Bild so gross wie die ganze Gruppe (1000 x 1000). */
    pruefe('Jedes Bild behaelt sein eigenes Mass',
      mitBild[0] && mitBild[0].bild.w === 100 && mitBild[0].bild.h === 50
      && mitBild[1] && mitBild[1].bild.w === 200 && mitBild[1].bild.h === 100,
      mitBild.map(b => b.bild.w + 'x' + b.bild.h).join(', '));
    pruefe('Keines bekommt das Mass der ganzen Gruppe',
      mitBild.every(b => b.bild.w < 900), mitBild.map(b => b.bild.w).join(', '));

    // Die alte Form: w:pict mit v:imagedata
    const vml = '<w:p><w:r><w:pict>'
      + '<v:shape id="Bild1" style="position:absolute;width:150pt;height:75pt">'
      + '<v:imagedata r:id="rId1" o:title="alt"/></v:shape>'
      + '</w:pict></w:r></w:p>';
    erg = await liesRoh('', vml, {
      'word/_rels/document.xml.rels': relsXml([['rId1', 'media/a.png']]),
      'word/media/a.png': bildBytes
    });
    mitBild = erg.bloecke.filter(b => b.bild);
    pruefe('Ein Bild in der alten VML-Form kommt an', mitBild.length === 1,
      'gezaehlt: ' + mitBild.length);
    /* 150 pt sind 200 px – Word rechnet in Punkten, das Heft in Pixeln. */
    pruefe('Sein Mass wird aus dem Stil gelesen',
      mitBild[0] && mitBild[0].bild.w === 200 && mitBild[0].bild.h === 100,
      mitBild[0] ? mitBild[0].bild.w + 'x' + mitBild[0].bild.h : '-');

    // Der Dokumenthintergrund
    const mitHintergrund = '<w:background w:color="FFFFFF">'
      + '<v:background><v:fill r:id="rId9" type="frame"/></v:background></w:background>';
    erg = await liesRoh(mitHintergrund, '<w:p><w:r><w:t>Text</w:t></w:r></w:p>', {
      'word/_rels/document.xml.rels': relsXml([['rId9', 'media/bg.png']]),
      'word/media/bg.png': bildBytes
    });
    pruefe('Der Dokumenthintergrund wird gelesen',
      !!erg.hintergrund && /^data:image\/png/.test(erg.hintergrund.src),
      JSON.stringify(erg.hintergrund));
    pruefe('Er steht auch im Bericht', erg.bericht.hintergrund === true, erg.bericht.hintergrund);
    pruefe('Und er ist kein Bild im Text', erg.bloecke.every(b => !b.bild),
      'eines ist als Bild durchgerutscht');

    // Ein Wasserzeichen in der Kopfzeile
    const kopfzeile = '<?xml version="1.0"?><w:hdr ' + NS + '><w:p><w:r><w:pict>'
      + '<v:shape id="WordPictureWatermark123" style="width:400pt;height:300pt">'
      + '<v:imagedata r:id="rIdW" o:title="Entwurf"/></v:shape>'
      + '</w:pict></w:r></w:p></w:hdr>';
    erg = await liesRoh('', '<w:p><w:r><w:t>Text</w:t></w:r></w:p>', {
      'word/_rels/document.xml.rels': relsXml([]),
      'word/header1.xml': kopfzeile,
      'word/_rels/header1.xml.rels': relsXml([['rIdW', 'media/wz.png']]),
      'word/media/wz.png': bildBytes
    });
    pruefe('Ein Wasserzeichen aus der Kopfzeile wird zum Hintergrund',
      !!erg.hintergrund, JSON.stringify(erg.hintergrund));

    /* Ein Logo in der Kopfzeile ist KEIN Hintergrund. Wuerde es eines,
       zoege es die Seite auf und laege unter dem ganzen Text. */
    const logoKopf = '<?xml version="1.0"?><w:hdr ' + NS + '><w:p><w:r><w:pict>'
      + '<v:shape id="Bild7" style="width:60pt;height:30pt">'
      + '<v:imagedata r:id="rIdL"/></v:shape>'
      + '</w:pict></w:r></w:p></w:hdr>';
    erg = await liesRoh('', '<w:p><w:r><w:t>Text</w:t></w:r></w:p>', {
      'word/_rels/document.xml.rels': relsXml([]),
      'word/header1.xml': logoKopf,
      'word/_rels/header1.xml.rels': relsXml([['rIdL', 'media/logo.png']]),
      'word/media/logo.png': bildBytes
    });
    pruefe('Ein kleines Logo in der Kopfzeile wird keiner',
      erg.hintergrund === null, JSON.stringify(erg.hintergrund));

    // Ohne alles bleibt es bei null
    erg = await liesRoh('', '<w:p><w:r><w:t>Nur Text</w:t></w:r></w:p>', {});
    pruefe('Ein Dokument ohne Hintergrund bekommt keinen',
      erg.hintergrund === null && erg.bericht.hintergrund === false,
      JSON.stringify(erg.hintergrund));


    /* ══ 4c. WAS BISHER STILL WEGFIEL ══════════════════════════════════
       Drei Dinge, die ein Word-Dokument aus einer Vorlage ausmachen und
       die der Leser gar nicht kannte: das Inhaltssteuerelement, in das
       Word ganze Deckblätter packt, der Text in Formen, und die Formen
       selbst. Ohne sie blieb von so einem Dokument ein Bild und sonst
       nichts – genau so wurde es gemeldet. */
    abschnitt('Steuerelemente, Textrahmen und Formen');

    // Ein Inhaltssteuerelement ist nur eine Hülle
    erg = await liesRoh('',
      '<w:sdt><w:sdtContent>'
      + '<w:p><w:r><w:t>Text im Steuerelement</w:t></w:r></w:p>'
      + '<w:tbl><w:tr><w:tc><w:p><w:r><w:t>Zelle</w:t></w:r></w:p></w:tc></w:tr></w:tbl>'
      + '</w:sdtContent></w:sdt>', {});
    let htmlAlles = erg.bloecke.map(b => b.html || '').join('');
    pruefe('Text aus einem Inhaltssteuerelement kommt an',
      htmlAlles.includes('Text im Steuerelement'), htmlAlles.slice(0, 120));
    pruefe('Eine Tabelle darin auch',
      htmlAlles.includes('<table class="j-table"') && htmlAlles.includes('Zelle'), htmlAlles.slice(0, 200));

    // Text in einem Textrahmen
    const rahmen = '<w:p><w:r><w:drawing><wp:inline><wp:extent cx="2857500" cy="952500"/>'
      + '<wps:wsp><wps:spPr><a:xfrm><a:ext cx="2857500" cy="952500"/></a:xfrm>'
      + '<a:prstGeom prst="rect"/><a:noFill/></wps:spPr>'
      + '<wps:txbx><w:txbxContent><w:p><w:r><w:t>Titel im Rahmen</w:t></w:r></w:p></w:txbxContent></wps:txbx>'
      + '</wps:wsp></wp:inline></w:drawing></w:r></w:p>';
    erg = await liesRoh('', rahmen, {});
    htmlAlles = erg.bloecke.map(b => b.html || '').join('');
    pruefe('Text aus einem Textrahmen kommt an',
      htmlAlles.includes('Titel im Rahmen'), htmlAlles.slice(0, 160));
    pruefe('Er kommt nur EINMAL', (htmlAlles.match(/Titel im Rahmen/g) || []).length === 1,
      (htmlAlles.match(/Titel im Rahmen/g) || []).length + 'x');

    let formen = erg.bloecke.filter(b => b.form);
    pruefe('Der Rahmen selbst wird eine Form', formen.length === 1, 'gezaehlt: ' + formen.length);
    /* Eine Form mit Text legt sich HINTER ihn – sonst deckte sie zu, was
       in ihr steht (canvas/objects.js, z-index 2000). */
    pruefe('Sie liegt hinter ihrem Text',
      formen[0] && formen[0].form.layer === 'back', formen[0] && formen[0].form.layer);
    pruefe('Und sie nimmt die Hoehe ihres Textes an',
      formen[0] && formen[0].form.passtSichAn === true, 'feste Hoehe');

    // Eine Form ohne Text: Farbe, Strich, Art
    const kreis = '<w:p><w:r><w:drawing><wp:inline><wp:extent cx="2857500" cy="1428750"/>'
      + '<wps:wsp><wps:spPr><a:xfrm><a:ext cx="2857500" cy="1428750"/></a:xfrm>'
      + '<a:prstGeom prst="ellipse"/>'
      + '<a:solidFill><a:srgbClr val="4472C4"/></a:solidFill>'
      + '<a:ln w="19050"><a:solidFill><a:srgbClr val="203864"/></a:solidFill></a:ln>'
      + '</wps:spPr></wps:wsp></wp:inline></w:drawing></w:r></w:p>';
    erg = await liesRoh('', kreis, {});
    formen = erg.bloecke.filter(b => b.form);
    pruefe('Ein Kreis aus Word wird eine Ellipse',
      formen.length === 1 && formen[0].form.shapeType === 'ellipse',
      formen.map(f => f.form.shapeType).join(', '));
    pruefe('Mit seinem Mass', formen[0] && formen[0].form.w === 300 && formen[0].form.h === 150,
      formen[0] ? formen[0].form.w + 'x' + formen[0].form.h : '-');
    pruefe('Mit Fuellung und Strich',
      formen[0] && formen[0].form.fill === '#4472C4' && formen[0].form.stroke === '#203864',
      formen[0] ? formen[0].form.fill + ' / ' + formen[0].form.stroke : '-');
    pruefe('Und mit der Strichbreite', formen[0] && formen[0].form.strokeWidth === 2,
      formen[0] && formen[0].form.strokeWidth);
    pruefe('Ohne Text haelt sie ihren Platz frei',
      formen[0] && !formen[0].form.passtSichAn && /^(<p><br><\/p>)+$/.test(formen[0].html),
      formen[0] && formen[0].html.slice(0, 40));

    // Die Designfarben aus dem Thema
    const thema = '<?xml version="1.0"?><a:theme xmlns:a="' + I.A + '"><a:themeElements>'
      + '<a:clrScheme name="Test">'
      + '<a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1>'
      + '<a:accent1><a:srgbClr val="FF6600"/></a:accent1>'
      + '</a:clrScheme></a:themeElements></a:theme>';
    const mitDesign = '<w:p><w:r><w:drawing><wp:inline><wp:extent cx="952500" cy="952500"/>'
      + '<wps:wsp><wps:spPr><a:xfrm><a:ext cx="952500" cy="952500"/></a:xfrm>'
      + '<a:prstGeom prst="rect"/>'
      + '<a:solidFill><a:schemeClr val="accent1"/></a:solidFill>'
      + '</wps:spPr></wps:wsp></wp:inline></w:drawing></w:r></w:p>';
    erg = await liesRoh('', mitDesign, { 'word/theme/theme1.xml': thema });
    formen = erg.bloecke.filter(b => b.form);
    pruefe('Eine Designfarbe wird aufgeloest',
      formen[0] && formen[0].form.fill === '#FF6600',
      formen[0] ? formen[0].form.fill : 'keine Form');

    // Die alte Form
    const vmlKasten = '<w:p><w:r><w:pict>'
      + '<v:rect style="width:150pt;height:75pt" fillcolor="#eeeeee" strokecolor="#333333" strokeweight="1.5pt">'
      + '<v:textbox><w:txbxContent><w:p><w:r><w:t>Alter Kasten</w:t></w:r></w:p></w:txbxContent></v:textbox>'
      + '</v:rect></w:pict></w:r></w:p>';
    erg = await liesRoh('', vmlKasten, {});
    formen = erg.bloecke.filter(b => b.form);
    htmlAlles = erg.bloecke.map(b => b.html || '').join('');
    pruefe('Ein Kasten in der alten VML-Form kommt an', formen.length === 1,
      'gezaehlt: ' + formen.length);
    pruefe('Mit Farbe und Mass',
      formen[0] && formen[0].form.fill === '#eeeeee' && formen[0].form.w === 200,
      formen[0] ? formen[0].form.fill + ' ' + formen[0].form.w : '-');
    pruefe('Und sein Text steht darin',
      htmlAlles.includes('Alter Kasten') && (htmlAlles.match(/Alter Kasten/g) || []).length === 1,
      htmlAlles.slice(0, 120));

    /* Word schreibt eine Zeichnung oft zweimal – heutige Form und
       Ersatzfassung. Wer beide liest, bekommt htmlAlles doppelt. */
    const doppelt = '<w:p><w:r><mc:AlternateContent>'
      + '<mc:Choice Requires="wps"><w:drawing><wp:inline><wp:extent cx="952500" cy="952500"/>'
      + '<pic:pic><pic:blipFill><a:blip r:embed="rId1"/></pic:blipFill>'
      + '<pic:spPr><a:xfrm><a:ext cx="952500" cy="952500"/></a:xfrm>'
      + '<a:prstGeom prst="rect"/></pic:spPr></pic:pic>'
      + '</wp:inline></w:drawing></mc:Choice>'
      + '<mc:Fallback><w:pict><v:shape style="width:100pt;height:100pt">'
      + '<v:imagedata r:id="rId1"/></v:shape></w:pict></mc:Fallback>'
      + '</mc:AlternateContent></w:r></w:p>';
    erg = await liesRoh('', doppelt, {
      'word/_rels/document.xml.rels': relsXml([['rId1', 'media/a.png']]),
      'word/media/a.png': bildBytes
    });
    pruefe('Eine doppelt geschriebene Zeichnung kommt einmal an',
      erg.bloecke.filter(b => b.bild).length === 1,
      'gezaehlt: ' + erg.bloecke.filter(b => b.bild).length);
    /* Jedes Bild bringt seine eigene Geometrie mit (prstGeom im pic:spPr).
       Wer die als Form nimmt, setzt hinter jedes Bild ein Rechteck. */
    pruefe('Die Geometrie eines Bildes wird keine Form',
      erg.bloecke.filter(b => b.form).length === 0,
      'gezaehlt: ' + erg.bloecke.filter(b => b.form).length);

    pruefe('Der Bericht zaehlt die Formen', typeof erg.bericht.formen === 'number',
      JSON.stringify(erg.bericht));

    /* ══ 5. DER RUNDLAUF ════════════════════════════════════════════
       Ein Heft durch den eigenen Word-Export und wieder zurück. Das ist
       der schaerfste Test ohne Word: beide Seiten sind im Haus, also
       muss herauskommen, was hineinging.

       Was der Rundlauf NICHT beweist: dass echte Word-Dateien gelesen
       werden. Der Export schreibt nur die Formen, die Inkwells selbst
       kennt. Dafuer stehen die Bausteine oben, von Hand gebaut.
       ═══════════════════════════════════════════════════════════════ */
    abschnitt('Rundlauf gegen den eigenen Export');

    const heft = {
      name: 'Rundlauf',
      pages: [{
        id: 'p1', bg: 'ruled', w: 794, h: 1123, inkStrokes: [], objects: [],
        textContent:
          '<h1>Erste Ueberschrift</h1>'
          + '<p>Ein gewoehnlicher Absatz.</p>'
          + '<p><b>fett</b> und <i>kursiv</i> und <u>unterstrichen</u></p>'
          + '<p><font color="#c04040">rot</font></p>'
          + '<p class="j-align-center">zentriert</p>'
          + '<ul class="j-list-disc"><li>eins</li><li>zwei</li></ul>'
          + '<ol class="j-list-decimal"><li>erstens</li><li>zweitens</li></ol>'
      }]
    };

    const datei = await InkwellsDocx.build([{ page: heft.pages[0], bg: 'ruled' }], { scale: 1 });
    const zurueck = await InkwellsDocxImport.lese(datei);
    const rundHtml = zurueck.bloecke.map(b => b.html).join('');

    /* Der Export malt die Listenmarke als Text davor und setzt einen
       Tabulator – er kennt keine echten Listen. Beim Zurueckkommen ist
       daraus wieder ein Absatz geworden. Geprueft wird deshalb der
       TEXT, nicht die Bauform. */
    const nurText = (html) => html.replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();

    for (const [was, text] of [
      ['Ueberschrift', 'Erste Ueberschrift'],
      ['Absatz', 'Ein gewoehnlicher Absatz.'],
      ['Listenpunkte', 'eins'],
      ['Nummerierung', 'erstens']
    ]) {
      pruefe('Rundlauf behaelt: ' + was, nurText(rundHtml).includes(text), nurText(rundHtml).slice(0, 120));
    }

    /* Der Text steckt in <font> und <i>: der Export schreibt das
       AUSSEHEN der Ueberschrift als Auszeichnung an den Laeufen (gross,
       kursiv, eigene Farbe), und der Import bringt sie treu zurueck.
       Das ist richtig so – aus einer echten Word-Datei waere eine
       kursive Ueberschrift ebenfalls gemeint. Geprueft wird deshalb die
       Huelle und der Text, nicht die Zeichenkette als Ganzes. */
    const h1Auf = rundHtml.indexOf('<h1');
    const h1Zu = rundHtml.indexOf('</h1>');
    pruefe('Rundlauf behaelt die Ueberschrift als h1',
      h1Auf === 0 && h1Zu > 0
      && nurText(rundHtml.slice(h1Auf, h1Zu)) === 'Erste Ueberschrift',
      rundHtml.slice(0, 120));
    pruefe('Rundlauf behaelt fett und kursiv',
      rundHtml.includes('<b>fett</b>') && rundHtml.includes('<i>kursiv</i>'), rundHtml.slice(0, 200));
    pruefe('Rundlauf behaelt die Farbe', rundHtml.includes('<font color="#c04040">rot</font>'),
      rundHtml.slice(0, 260));
    pruefe('Rundlauf behaelt die Ausrichtung', rundHtml.includes('class="j-align-center"'),
      rundHtml.slice(0, 300));

    // Und auch der Rundlauf muss den Sanitizer unveraendert ueberstehen
    pruefe('Rundlauf ueberlebt den Sanitizer',
      zurueck.bloecke.every(b => sanitizePageHtml(b.html) === b.html),
      zurueck.bloecke.map(b => b.html).find(h => sanitizePageHtml(h) !== h) || '');

  } catch (err) {
    zeilen.push('ABBRUCH ' + err.message + ' | ' + String(err.stack).split('\n')[1]);
  }

  window.__ergebnis = zeilen.join('\n');
})();
</script>
</body>
