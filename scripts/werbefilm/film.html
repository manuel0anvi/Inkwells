<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inkwells 15s</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #12121a; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ══════════════════════════════════════════════════════════════════════
   FUENFZEHN SEKUNDEN, AUF EINE LEINWAND GEMALT

   Der erste Anlauf lief ueber CSS: vier <img> mit transform:scale, vom
   Browser uebereinandergeblendet, und jedes Einzelbild ueber
   Page.captureScreenshot geholt. Das war zu langsam — nach fuenfzehn
   Minuten stand er bei Bild 226 von 450.

   Der Grund lag nicht am Aufnehmen, sondern am Rechnen davor: bei jedem
   Bild hat Chromium die mehrere Megapixel grossen Aufnahmen neu
   abgetastet (die hochkante Blattaufnahme allein ist 2483x3470), und
   waehrend einer Ueberblendung gleich zwei davon.

   Hier wird stattdessen gezeichnet. drawImage bekommt ein QUELLRECHTECK
   mit — die Kamerafahrt IST dieses Rechteck — und tastet damit nur den
   Ausschnitt ab, der wirklich ins Bild kommt. Die Vorlagen liegen
   ausserdem schon auf 1920 heruntergerechnet in werbefilm/quellen
   (ffmpeg, in main.js). Aus Minuten je Bild werden Millisekunden.

   >>> Warum die Bildnummer und nicht die Uhr <<<
   Es laeuft nichts von selbst: kein requestAnimationFrame, keine
   CSS-Animation. main.js sagt „male Bild 137", und erst dann wird
   gemalt. Damit ist der Film gleichmaessig, egal wie beschaeftigt der
   Rechner beim Aufnehmen gerade war.
   ══════════════════════════════════════════════════════════════════════ */

const B = 1920, H = 1080;
const FPS = 30, DAUER = 15;
const BLENDE = 0.5;

const GRUND = '#12121a';
const GOLD = '#c8a96e';
const GOLD_HELL = '#e0c07a';
const HELL = '#ede8e0';

const c = document.getElementById('c');
const ctx = c.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

const weich = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const misch = (a, b, p) => a + (b - a) * p;
const klemm = (x, a, b) => Math.max(a, Math.min(b, x));

/* ── Die Einstellungen ────────────────────────────────────────────────
   `zoom` ist der Bildausschnitt: 1 heisst ganze Breite, 1.15 heisst
   naeher dran. `x` und `y` sind die Lage des Ausschnitts im Bild, von
   0 (ganz oben/links) bis 1 (ganz unten/rechts) — bei 0.5 in der Mitte.
   Sie ueberlappen sich um genau eine Blendenlaenge. */
const SCHNITTE = [
  /* >>> Warum die Zoomwerte so klein sind <<<
     Die Vorlagen sind auf genau 1920 gerechnet. Zoom 1.0 heisst damit
     Pixel auf Pixel; alles darueber ist Hochrechnen und wird weich. Im
     ersten Anlauf standen hier 1.30 und 1.34 — der Text auf dem Blatt
     war dreimal so gross wie noetig und sichtbar unscharf. Die Bewegung
     soll aus der FAHRT kommen, nicht aus der Vergroesserung. */
  {
    quelle: 'blatt', von: 0.0, bis: 3.9,
    /* Die einzige Fahrt, die etwas BEHAUPTET: sie faengt beim getippten
       Text an und hoert bei der Handschrift auf, auf demselben Blatt.
       Das ist der Satz, um den es geht — als Kamerabewegung statt als
       Behauptung in der Zeile darunter. */
    zoom: [1.00, 1.07], x: [0.5, 0.5], y: [0.03, 0.52],
    text: [['Typed text and handwriting. ', 0], ['One page.', 1]]
  },
  {
    quelle: 'B-uebersicht', von: 3.4, bis: 6.9,
    zoom: [1.07, 1.00], x: [0.45, 0.5], y: [0.35, 0.45],
    text: [['Every notebook ', 0], ['in one place.', 1]]
  },
  {
    quelle: 'F-tabelle-formel', von: 6.4, bis: 9.9,
    zoom: [1.00, 1.12], x: [0.5, 0.46], y: [0.30, 0.16],
    text: [['Formulas, tables, ', 0], ['PDFs.', 1]]
  },
  {
    quelle: 'C-zusammen', von: 9.4, bis: 13.1,
    zoom: [1.12, 1.00], x: [0.72, 0.50], y: [0.45, 0.50],
    text: [['Edit together, ', 0], ['live.', 1]]
  }
];

const ENDE_VON = 12.6;
const BILDER = {};

/* Der dunkle Rand. Einmal gebaut und dann nur noch aufgelegt – ein
   Verlauf je Einzelbild neu zu rechnen kostet mehr als das Bild. */
let vignette = null;
function baueVignette() {
  const v = document.createElement('canvas');
  v.width = B; v.height = H;
  const g = v.getContext('2d');
  const r = g.createRadialGradient(B / 2, H * 0.48, H * 0.28, B / 2, H * 0.48, H * 0.92);
  r.addColorStop(0, 'rgba(0,0,0,0)');
  r.addColorStop(0.62, 'rgba(0,0,0,.30)');
  r.addColorStop(1, 'rgba(0,0,0,.72)');
  g.fillStyle = r; g.fillRect(0, 0, B, H);
  vignette = v;
}

/** Eine Einstellung malen: Quellrechteck ausrechnen, Ausschnitt zeichnen. */
function maleSchnitt(s, p, deckung) {
  const im = BILDER[s.quelle];
  if (!im) return;
  const z = misch(s.zoom[0], s.zoom[1], p);

  /* Das Quellrechteck hat immer 16:9 – sonst verzerrte das Bild. Es ist
     so gross, wie der Zoom erlaubt, und passt in jedem Fall ins Bild. */
  let sw = im.naturalWidth / z;
  let sh = sw * H / B;
  if (sh > im.naturalHeight) { sh = im.naturalHeight; sw = sh * B / H; }

  const freiX = im.naturalWidth - sw;
  const freiY = im.naturalHeight - sh;
  const sx = klemm(misch(s.x[0], s.x[1], p), 0, 1) * freiX;
  const sy = klemm(misch(s.y[0], s.y[1], p), 0, 1) * freiY;

  ctx.globalAlpha = deckung;
  ctx.drawImage(im, sx, sy, sw, sh, 0, 0, B, H);
  ctx.globalAlpha = 1;
}

/* ── Der dunkle Fuss unter der Zeile ──────────────────────────────────
   Im ersten Anlauf stand die Zeile mit blossem Schatten ueber dem Bild.
   Ueber der Uebersicht ging das (dunkel), ueber dem BLATT nicht: cremes
   Papier, weisse Schrift, dazwischen die Handschrift — unlesbar.

   Ein Schatten hilft da nicht, er macht helle Flaechen nur schmutzig.
   Es braucht einen Grund, und zwar einen, der von selbst verschwindet:
   er kommt und geht mit der Zeile, nicht mit der Einstellung. */
let fuss = null;
function baueFuss() {
  const f = document.createElement('canvas');
  f.width = 8; f.height = H;
  const g = f.getContext('2d');
  const v = g.createLinearGradient(0, H * 0.60, 0, H);
  v.addColorStop(0, 'rgba(10,10,16,0)');
  v.addColorStop(0.45, 'rgba(10,10,16,.55)');
  v.addColorStop(1, 'rgba(10,10,16,.88)');
  g.fillStyle = v; g.fillRect(0, 0, 8, H);
  fuss = f;
}

/** Die Zeile unten: normaler Text in Creme, betonter in Gold. */
function maleZeile(teile, deckung) {
  if (deckung <= 0.002) return;
  const gross = 58;
  const yy = H * 0.895 + misch(16, 0, deckung);

  if (fuss) {
    ctx.save();
    ctx.globalAlpha = deckung;
    ctx.drawImage(fuss, 0, 0, 8, H, 0, 0, B, H);
    ctx.restore();
  }

  const stuecke = teile.map(([t, fett]) => {
    ctx.font = (fett ? '600 ' : '400 ') + gross + 'px "Crimson Pro", Georgia, serif';
    return { t, fett, w: ctx.measureText(t).width };
  });
  const breite = stuecke.reduce((a, s) => a + s.w, 0);

  ctx.save();
  ctx.globalAlpha = deckung;
  ctx.textBaseline = 'alphabetic';
  /* Ein Schatten, weil die Zeile ueber wechselndem Grund steht – ueber
     dem hellen Blatt waere sie ohne ihn nicht zu lesen. */
  ctx.shadowColor = 'rgba(0,0,0,.9)';
  ctx.shadowBlur = 26;
  let x = (B - breite) / 2;
  for (const s of stuecke) {
    ctx.font = (s.fett ? '600 ' : '400 ') + gross + 'px "Crimson Pro", Georgia, serif';
    ctx.fillStyle = s.fett ? GOLD_HELL : HELL;
    ctx.fillText(s.t, x, yy);
    x += s.w;
  }
  ctx.shadowBlur = 0;

  // Der goldene Strich darunter waechst mit der Zeile auf
  const sb = deckung * 190;
  const g = ctx.createLinearGradient(B / 2 - sb, 0, B / 2 + sb, 0);
  g.addColorStop(0, 'rgba(200,169,110,0)');
  g.addColorStop(0.5, GOLD);
  g.addColorStop(1, 'rgba(200,169,110,0)');
  ctx.fillStyle = g;
  ctx.fillRect(B / 2 - sb, yy + 30, sb * 2, 2);
  ctx.restore();
}

/** Die Schlusstafel: Zeichen, Name, Satz, Adresse. */
function maleEnde(deckung) {
  if (deckung <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = deckung;
  ctx.fillStyle = GRUND;
  ctx.fillRect(0, 0, B, H);

  const mitte = H / 2;

  /* Das Zeichen aus der Titelleiste (src/index.html), von Hand
     nachgezogen: ein Heft mit Ruecken und drei Zeilen. */
  const s = 86, zx = B / 2 - 250, zy = mitte - 78;
  const e = s / 15;                       // das SVG ist 15 Einheiten breit
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1.2 * e;
  ctx.beginPath();
  ctx.roundRect(zx + 2 * e, zy + 2 * e, 11 * e, 11 * e, 2 * e);
  ctx.stroke();
  ctx.globalAlpha = deckung * 0.7;
  ctx.lineWidth = 1 * e;
  ctx.beginPath();
  ctx.moveTo(zx + 5 * e, zy + 2 * e); ctx.lineTo(zx + 5 * e, zy + 13 * e);
  ctx.moveTo(zx + 7 * e, zy + 5 * e); ctx.lineTo(zx + 12 * e, zy + 5 * e);
  ctx.moveTo(zx + 7 * e, zy + 8 * e); ctx.lineTo(zx + 12 * e, zy + 8 * e);
  ctx.moveTo(zx + 7 * e, zy + 11 * e); ctx.lineTo(zx + 10 * e, zy + 11 * e);
  ctx.stroke();
  ctx.globalAlpha = deckung;

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = HELL;
  ctx.font = '400 104px "Crimson Pro", Georgia, serif';
  const wort = 'INKWELLS';
  const sperr = 22;
  let w = 0;
  for (const ch of wort) w += ctx.measureText(ch).width + sperr;
  let x = zx + 130;
  for (const ch of wort) {
    ctx.fillText(ch, x, mitte + 22);
    x += ctx.measureText(ch).width + sperr;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9a9080';
  ctx.font = 'italic 400 34px "Crimson Pro", Georgia, serif';
  ctx.fillText('Typed and handwritten. One page.', B / 2, mitte + 96);

  ctx.fillStyle = GOLD;
  ctx.font = '400 27px "DM Mono", ui-monospace, monospace';
  let n = 0;
  const netz = 'inkwells.me';
  for (const ch of netz) n += ctx.measureText(ch).width + 9;
  let nx = B / 2 - n / 2;
  for (const ch of netz) {
    ctx.fillText(ch, nx + ctx.measureText(ch).width / 2, mitte + 168);
    nx += ctx.measureText(ch).width + 9;
  }
  ctx.restore();
}

window.__bild = function (n) {
  const t = n / FPS;
  ctx.fillStyle = GRUND;
  ctx.fillRect(0, 0, B, H);

  let obenAuf = null, obenD = 0;
  for (const s of SCHNITTE) {
    if (t < s.von || t > s.bis) continue;
    const auf = weich(klemm((t - s.von) / BLENDE, 0, 1));
    const zu = weich(klemm((s.bis - t) / BLENDE, 0, 1));
    const d = auf * zu;
    if (d <= 0.002) continue;
    const p = weich(klemm((t - s.von) / (s.bis - s.von), 0, 1));
    maleSchnitt(s, p, d);
    if (d > obenD) { obenD = d; obenAuf = s; }
  }

  if (vignette) ctx.drawImage(vignette, 0, 0);

  /* Die Zeile kommt spaeter als ihr Bild und geht frueher: erst sehen,
     dann lesen. Waehrend einer Ueberblendung steht keine – zwei Zeilen
     uebereinander liest niemand. */
  if (obenAuf) {
    const a = obenAuf.von + 0.8, b = obenAuf.bis - 0.9;
    const zd = weich(klemm((t - a) / 0.45, 0, 1)) * weich(klemm((b - t) / 0.35, 0, 1));
    maleZeile(obenAuf.text, zd);
  }

  maleEnde(weich(klemm((t - ENDE_VON) / 0.7, 0, 1)));
  return true;
};

/* Erst melden, wenn Bilder UND Schriften da sind. Ein nicht geladenes
   "Crimson Pro" faellt lautlos auf Georgia zurueck – der Film saehe
   dann eine Spur anders aus als die App, und man suchte lange. */
window.__bereit = (async () => {
  const namen = ['blatt', 'B-uebersicht', 'F-tabelle-formel', 'C-zusammen'];
  await Promise.all(namen.map(nm => new Promise(r => {
    const im = new Image();
    im.onload = () => { BILDER[nm] = im; r(); };
    im.onerror = () => r();
    im.src = '../../werbefilm/quellen/' + nm + '.jpg';
  })));

  if (document.fonts) {
    try {
      await Promise.all([
        document.fonts.load('400 58px "Crimson Pro"'),
        document.fonts.load('600 58px "Crimson Pro"'),
        document.fonts.load('italic 400 34px "Crimson Pro"'),
        document.fonts.load('400 27px "DM Mono"')
      ]);
      await document.fonts.ready;
    } catch (e) { /* ohne Netz bleibt Georgia – kein Grund abzubrechen */ }
  }

  baueVignette();
  baueFuss();
  window.__bild(0);
  const fehlt = namen.filter(nm => !BILDER[nm]);
  return (fehlt.length ? 'FEHLT: ' + fehlt.join(', ') : 'alle Bilder da')
    + ' · Crimson Pro: ' + (document.fonts.check('400 58px "Crimson Pro"') ? 'ja' : 'nein');
})();

/** Das fertige Einzelbild als JPEG – main.js schreibt es weg. */
window.__jpeg = () => c.toDataURL('image/jpeg', 0.95).slice(23);
</script>
</body>
</html>
