<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/base.css">
<link rel="stylesheet" href="../../src/css/pages.css">
<style>
  body { margin: 0; background: #222; }
  #pg-scroll { position: relative; }
  .j-page { position: relative; overflow: hidden; }
</style>
</head>
<body>
<div id="pg-scroll">
  <div class="j-page bg-ruled" data-pgid="p1" style="width:794px;height:1123px">
    <div class="j-page-hdr"><span class="j-page-num">Seite 1</span></div>
    <canvas class="j-canvas" width="794" height="1123"
            style="width:794px;height:1123px;pointer-events:none"></canvas>
    <div class="j-objects"></div>
    <div class="j-text" contenteditable="true"
         style="font-size:17px;line-height:32px;padding-top:19px;top:64px;left:72px;right:32px;bottom:24px;pointer-events:auto;white-space:pre-wrap">Zeile mit Text</div>
  </div>
</div>

<script>
/* Umgebung nachbauen, so weit objects.js sie braucht */
const S = { mode: 'cursor', readOnly: false };
let _zoom = 1;
let uidN = 0;
function uid() { return 'o' + (++uidN); }
function pushPageHistory() {}
function updateUndoRedoUI() {}
function toast() {}
function t() { return ''; }
function E(id) { return document.getElementById(id); }
/* Das Verschieben in objects.js braucht QA – bis jetzt hat diese Datei
   den Weg nie durchlaufen. */
function QA(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
window.markCurrentNotebookDirty = () => {};
</script>
<script src="../../src/canvas/objects.js"></script>
<!-- Formen sind Objekte: dieselbe Datei legt sie an und malt sie -->
<script src="../../src/canvas/shapes.js"></script>
<script src="../../src/core/formula.js"></script>
<script>
const out = [];
window.onerror = (msg, src, line) => {
  out.push('ABBRUCH ' + msg + ' @' + line);
  window.__ergebnis = out.join('\n');
};
function check(label, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  out.push((ok ? 'OK   ' : 'FEHL ') + label
    + (ok ? '' : '  erwartet ' + JSON.stringify(expected) + ', bekommen ' + JSON.stringify(actual)));
}

const pageEl = document.querySelector('.j-page');
const layer = pageEl.querySelector('.j-objects');

const a = { id: 'a', kind: 'image', src: '', name: 'A', x: 120, y: 300, w: 300, h: 200, rot: 0 };
const b = { id: 'b', kind: 'image', src: '', name: 'B', x: 220, y: 380, w: 300, h: 200, rot: 0 };
const page = { id: 'p1', objects: [a, b] };
placeObject(layer, a, page);
placeObject(layer, b, page);

const wrapOf = (o) => layer.querySelector('.obj-wrap[data-objid="' + o.id + '"]');
const bodyOf = (o) => wrapOf(o).querySelector('.obj-body');
const chromeOf = (o) => wrapOf(o).querySelector('.obj-chrome');
const barBtns = (o) => [...chromeOf(o).querySelectorAll('.obj-bar-btn')];
const zOf = (o) => bodyOf(o).style.zIndex;

// Reihenfolge in der Leiste: 0 links · 1 rechts · 2 vor Text · 3 hinter Text
//                            4 ganz vorn · 5 ganz hinten · 6 kopieren · 7 loeschen
const BTN = { sperren: 2, vorText: 3, hinterText: 4, ganzVorn: 5, ganzHinten: 6 };

function press(el, x, y) {
  el.dispatchEvent(new PointerEvent('pointerdown', {
    bubbles: true, cancelable: true, composed: true,
    clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse', button: 0, isPrimary: true
  }));
}
/** Wer liegt an dieser Stelle obenauf? */
function oben(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return 'nichts';
  const wrap = el.closest ? el.closest('.obj-wrap') : null;
  return wrap ? wrap.dataset.objid : (el.className || el.tagName);
}

/* 1. Ausgangslage: beide vorne, B ueber A */
check('A und B liegen im vorderen Band', [zOf(a), zOf(b)], ['2000', '2001']);

const UX = 300, UY = 420;   // Stelle, an der beide liegen
check('B liegt an der Ueberlappung oben', oben(UX, UY), 'b');

/* 2. Auswaehlen aendert nichts an der Ebene */
press(bodyOf(a), 140, 320);
check('A ist ausgewaehlt', wrapOf(a).classList.contains('selected'), true);
check('Die Bedienteile sind sichtbar', chromeOf(a).style.display, 'block');
check('Die Ebene ist unveraendert', zOf(a), '2000');
check('B ist unveraendert', zOf(b), '2001');
check('B liegt weiterhin oben', oben(UX, UY), 'b');

/* 3. Die Knoepfe sind erreichbar */
const btns = barBtns(a);
check('Neun Knoepfe in der Leiste', btns.length, 9);
const daneben = btns.map((btn, i) => {
  const r = btn.getBoundingClientRect();
  const el = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
  return (el && btn.contains(el)) ? null : (i + ':' + (el ? el.className : 'nichts'));
}).filter(Boolean);
check('Jeder Knopf faengt den Zeiger', daneben, []);

/* 3b. Gesperrt rutscht unter die Handschrift (1100), bleibt aber vor dem
   Text (1000) – und entsperrt wieder dorthin, wo es war */
btns[BTN.sperren].click();
check('Gesperrt liegt zwischen Text und Handschrift', zOf(a), '1050');
check('Und ist so vermerkt', a.gesperrt, true);
check('Die Griffe sind weg', [...chromeOf(a).querySelectorAll('.obj-handle')].some(h => h.offsetParent), false);
barBtns(a)[BTN.sperren].click();
check('Entsperrt wieder im vorderen Band', [zOf(a), a.gesperrt], ['2000', undefined]);

/* 4. "Ganz nach vorn" wirkt UNTER den Bildern */
btns[BTN.ganzVorn].click();
check('A steht jetzt hinten in der Liste', page.objects.map(o => o.id), ['b', 'a']);
check('Und traegt die hoehere Zahl', [zOf(b), zOf(a)], ['2000', '2001']);
check('A liegt an der Ueberlappung oben', oben(UX, UY), 'a');

btns[BTN.ganzHinten].click();
check('Und wieder zurueck', [zOf(a), zOf(b)], ['2000', '2001']);
check('B liegt wieder oben', oben(UX, UY), 'b');

/* 5. "Hinter den Text" wirkt NUR gegenueber dem Text */
btns[BTN.hinterText].click();
check('A wechselt ins hintere Band', zOf(a), '100');
check('Und ist so vermerkt', a.layer, 'back');
check('B bleibt voellig unberuehrt', [zOf(b), b.layer], ['2001', undefined]);
check('Die Bedienteile bleiben oben', chromeOf(a).style.zIndex, '5000');

const rb = barBtns(a)[BTN.hinterText].getBoundingClientRect();
const nochDa = document.elementFromPoint(rb.left + rb.width / 2, rb.top + rb.height / 2);
check('Die Leiste bleibt anklickbar', !!(nochDa && chromeOf(a).contains(nochDa)), true);

/* 6. Stapeln funktioniert auch INNERHALB des hinteren Bandes
      Hier trifft elementFromPoint den Text – beide Bilder liegen ja
      darunter. Gefragt ist deshalb der Faenger, der den Klick durch den
      Text hindurchreicht: er muss dasselbe oberste Bild waehlen. */
const gegriffen = (x, y) => {
  const w = backObjectAt(pageEl, x, y);
  return w ? w.dataset.objid : 'nichts';
};

press(bodyOf(b), 500, 560);
barBtns(b)[BTN.hinterText].click();
check('Jetzt liegen beide hinten', [zOf(a), zOf(b)], ['100', '101']);
check('B wird an der Ueberlappung gegriffen', gegriffen(UX, UY), 'b');

barBtns(b)[BTN.ganzHinten].click();
check('B ganz nach hinten', [page.objects.map(o => o.id), zOf(b), zOf(a)], [['b', 'a'], '100', '101']);
check('Jetzt wird A gegriffen', gegriffen(UX, UY), 'a');

/* 7. Ein Bild hinter dem Text laesst sich anklicken */
deselect();
press(document.elementFromPoint(140, 320), 140, 320);
check('Auswahl ueber den Text hinweg', wrapOf(a).classList.contains('selected'), true);

/* 8. Zurueck nach vorn */
barBtns(a)[BTN.vorText].click();
check('A ist wieder vorne', [zOf(a), a.layer], ['2001', 'front']);
check('B blieb hinten', [zOf(b), b.layer], ['100', 'back']);

/* ══════════════════════════════════════════════════════════════════
   9. FORMEN WERDEN EINGESETZT, NICHT AUFGEZOGEN

   Eine Form ist ein Objekt wie ein Bild – sie entsteht nur anders:
   ein Druck im Formen-Fenster legt sie hin (canvas/shapes.js,
   insertShape). Geprueft wird, dass dabei wirklich etwas entsteht,
   dass es auf der Seite liegt und nicht daneben, und dass zwei
   nacheinander nicht uebereinander landen – sonst saehe die zweite
   aus, als waere sie nie gekommen.
   ══════════════════════════════════════════════════════════════════ */
/* HDR muss mit: objects.js und shapes.js halten den Seitenkopf frei
   (core/state.js). Fehlt die Zahl, rechnen beide mit undefined. */
CFG = { PAGE_W: 794, PAGE_H: 1123, HDR: 58 };
S.activePgId = 'p1';
window.getPage = (id) => id === 'p1' ? { page } : null;

const vorher = page.objects.length;
check('Rechteck einsetzen meldet Erfolg', insertShape('rect'), true);
check('Und liegt in der Objektliste', page.objects.length, vorher + 1);

const form = page.objects[page.objects.length - 1];
check('Es ist eine Form', [form.kind, form.shapeType], ['shape', 'rect']);
check('Sie liegt ganz auf der Seite',
  form.x >= 0 && form.y >= 0
  && form.x + form.w <= CFG.PAGE_W && form.y + form.h <= CFG.PAGE_H, true);
check('Und ist gross genug zum Anfassen', form.w > 100 && form.h > 60, true);
check('Sie steht auch wirklich auf der Seite', !!wrapOf(form), true);

insertShape('ellipse');
const zweite = page.objects[page.objects.length - 1];
check('Die zweite liegt nicht auf der ersten',
  zweite.x !== form.x || zweite.y !== form.y, true);

insertShape('arrow');
const pfeil = page.objects[page.objects.length - 1];
check('Ein Pfeil bekommt seine Enden',
  [!!pfeil.p1, !!pfeil.p2], [true, true]);

/* ══════════════════════════════════════════════════════════════════
   10. IM SEITENKOPF LIEGT NIE ETWAS

   Oben auf der Seite stehen Seitenzahl, Datum und die zwei Knoepfe.
   Ein Bild darueber deckte sie zu – und weil es vor dem Text liegt,
   war der Kopf danach nicht mehr zu treffen. Die Striche schneidet
   css/pages.css ab; die Objekte muessen sich selbst bremsen.
   ══════════════════════════════════════════════════════════════════ */
check('Eine eingesetzte Form beginnt unter dem Kopf',
  page.objects.filter(o => o.kind === 'shape').every(o => o.y >= CFG.HDR), true);

/* Ein Bild weit nach oben schieben: es muss am Kopf haengenbleiben.
   Zweimal druecken – der erste Druck waehlt nur aus, erst der zweite
   fasst an (canvas/objects.js). */
deselect();
const bStart = bodyOf(b).getBoundingClientRect();
press(bodyOf(b), bStart.left + 10, bStart.top + 10);
press(bodyOf(b), bStart.left + 10, bStart.top + 10);
bodyOf(b).dispatchEvent(new PointerEvent('pointermove', {
  bubbles: true, cancelable: true, clientX: bStart.left + 10, clientY: bStart.top - 900,
  pointerId: 1, pointerType: 'mouse', isPrimary: true
}));
check('Ein hinaufgeschobenes Bild bleibt am Kopf stehen', b.y >= CFG.HDR, true);
bodyOf(b).dispatchEvent(new PointerEvent('pointerup', {
  bubbles: true, cancelable: true, clientX: bStart.left + 10, clientY: bStart.top - 900,
  pointerId: 1, pointerType: 'mouse', isPrimary: true
}));

/* Ohne Bearbeitungsrecht darf gar nichts entstehen – derselbe Riegel
   wie ueberall sonst. */
const stand = page.objects.length;
S.readOnly = true;
check('Ohne Recht wird nichts eingesetzt', insertShape('rect'), false);
check('Und die Liste bleibt, wie sie war', page.objects.length, stand);
S.readOnly = false;

/* ══════════════════════════════════════════════════════════════════
   11. AN DER KANTE ZIEHT ES NUR EINE RICHTUNG

   Es gab nur Eckgriffe, und jeder rechnete die Hoehe aus der Breite:
   ein Rechteck liess sich nur als Ganzes aufblasen. Gemeldet wurde
   genau das.

   Geprueft wird an einer FORM, weil dort beides zusammenkommt: der
   Kantengriff muss die Breite allein aendern, und die Ecke muss
   weiterhin beides im Gleichschritt bewegen. Frueher war es ein Bild –
   Bilder haben seit Abschnitt 12 aber gar keine Kanten mehr.
   ══════════════════════════════════════════════════════════════════ */
deselect();
const kb = { id: 'kb', kind: 'shape', shapeType: 'rect', x: 100, y: 200, w: 200, h: 100, rot: 0 };
page.objects.push(kb);
placeObject(layer, kb, page);
const kbWrap = layer.querySelector('.obj-wrap[data-objid="kb"]');
kbWrap._waehleObjekt();

/** Einen Griff um dx/dy ziehen. */
function zieheGriff(klasse, dx, dy) {
  const g = kbWrap.querySelector('.obj-handle.' + klasse);
  if (!g) return false;
  const r = g.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const ev = (art, ex, ey) => g.dispatchEvent(new PointerEvent(art, {
    bubbles: true, cancelable: true, composed: true, clientX: ex, clientY: ey,
    pointerId: 4, pointerType: 'mouse', button: 0, isPrimary: true }));
  ev('pointerdown', x, y);
  ev('pointermove', x + dx, y + dy);
  ev('pointerup', x + dx, y + dy);
  return true;
}

check('Es gibt Griffe an allen vier Kanten',
  ['t', 'r', 'b', 'l'].every(k => !!kbWrap.querySelector('.obj-handle.' + k)), true);

const vorBreite = kb.w, vorHoehe = kb.h;
check('Die rechte Kante zieht nur die Breite', zieheGriff('r', 60, 0), true);
check('Und zwar wirklich (' + Math.round(kb.w) + ' statt ' + vorBreite + ')', kb.w > vorBreite + 30, true);
check('Die Hoehe bleibt, wie sie war (' + Math.round(kb.h) + ')', Math.round(kb.h), vorHoehe);

const vor2 = { w: kb.w, h: kb.h };
zieheGriff('b', 0, 50);
check('Die untere Kante zieht nur die Hoehe (' + Math.round(kb.h) + ')', kb.h > vor2.h + 25, true);
check('Und die Breite bleibt (' + Math.round(kb.w) + ')', Math.round(kb.w), Math.round(vor2.w));

// Die Ecke bewegt weiterhin beides im Gleichschritt
const vor3 = { w: kb.w, h: kb.h };
zieheGriff('br', 40, 0);
check('Die Ecke haelt das Verhaeltnis',
  Math.abs((kb.w / kb.h) - (vor3.w / vor3.h)) < 0.01, true);
check('Und sie aendert dabei beides', kb.h > vor3.h + 5, true);

/* ══════════════════════════════════════════════════════════════════
   12. BILD UND FORMEL NUR AN DEN ECKEN – UND DIE GRIFFE WACHSEN MIT

   Gemeldet: an Bildern und Formeln sollen die Griffe an den Seiten
   weg, und ein Griff darf nicht so gross sein wie das Ding selbst.
   ══════════════════════════════════════════════════════════════════ */
deselect();
const eb = { id: 'eb', kind: 'image', src: '', name: 'E', x: 100, y: 500, w: 240, h: 160, rot: 0 };
const ef = { id: 'ef', kind: 'formula', latex: 'x^2', x: 420, y: 500, w: 30, h: 20, natW: 30, natH: 20, rot: 0 };
page.objects.push(eb, ef);
placeObject(layer, eb, page);
placeObject(layer, ef, page);

const huelle = (id) => layer.querySelector('.obj-wrap[data-objid="' + id + '"]');
const nurEcken = (id) => ['tl', 'tr', 'bl', 'br'].every(k => !!huelle(id).querySelector('.obj-handle.' + k))
  && ['t', 'r', 'b', 'l'].every(k => !huelle(id).querySelector('.obj-handle.' + k));
check('Ein Bild hat nur Eckgriffe', nurEcken('eb'), true);
check('Eine Formel auch', nurEcken('ef'), true);
check('Eine Form behaelt ihre Kanten', !!kbWrap.querySelector('.obj-handle.t'), true);

const griffK = (id) => {
  huelle(id)._waehleObjekt();
  return parseFloat(huelle(id).querySelector('.obj-chrome').style.getPropertyValue('--griff-k'));
};
check('Am grossen Bild bleiben die Griffe voll', griffK('eb'), 1);
const kFormel = griffK('ef');
check('An der kleinen Formel werden sie kleiner (' + kFormel + ')', kFormel < 1 && kFormel >= 0.5, true);
huelle('ef')._waehleObjekt();
const breiteKlein = huelle('ef').querySelector('.obj-handle.br').getBoundingClientRect().width;
check('Und das sieht man auch (' + Math.round(breiteKlein) + ' px)', breiteKlein > 0 && breiteKlein < 12, true);

window.__ergebnis = out.join('\n');
</script>
</body>
</html>
