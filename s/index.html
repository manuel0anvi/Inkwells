<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Zweite Schicht unter js/sanitize.js: ein eingeschleustes
     <script src="https://fremd"> laeuft damit nicht. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://*.firebaseapp.com https://accounts.google.com https://login.microsoftonline.com https://*.firebasedatabase.app; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwells — Freigegebenes Heft</title>

<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" type="image/png" href="../icon.png">
<link rel="alternate icon" type="image/x-icon" href="../icon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Infant:ital,wght@0,300;1,300&family=Jost:wght@300;400;500&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<!-- Wie eine Seite aussieht: dieselben Regeln wie in der App, erzeugt von
     npm run sync-share. MUSS vor notebook.css stehen. -->
<link rel="stylesheet" href="../lib/katex.min.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/notebook.css">
<style>
.share-wrap {
  display: none;
  padding: 100px 20px 60px;
  min-height: 100vh;
  /* Die klebende Kopfzeile hat einen Hintergrund über die volle Breite
     (css/notebook.css) – ohne das gäbe er eine waagerechte Bildlaufleiste */
  overflow-x: clip;
}
.share-head {
  max-width: 1180px;
  margin: 0 auto 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
}
.share-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-style: italic;
  margin: 0;
  color: var(--cream);
}
.share-sub {
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}
.share-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--gold-light);
  border: 0.5px solid var(--navy-border);
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap;
}
.share-state {
  max-width: 620px;
  margin: 80px auto;
  text-align: center;
  font-family: 'Jost', sans-serif;
  color: var(--text-muted);
  padding: 0 20px;
  line-height: 1.7;
}
.share-state h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-style: italic;
  color: var(--cream);
  margin: 0 0 12px;
}
.share-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

/* Hinweis, dass Bearbeiten nur in der App geht. Im Browser bleibt ein
   geteiltes Dokument immer schreibgeschützt – auch mit Bearbeitungsrecht. */
.share-edit-hint {
  max-width: 1180px;
  margin: 0 auto 20px;
  padding: 10px 14px;
  border: 0.5px solid var(--navy-border);
  border-radius: 8px;
  background: rgba(224, 166, 58, .08);
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-muted);
}

/* Auf schmalen Bildschirmen passen Titel und Aktionen nicht nebeneinander:
   dann untereinander, mit den Knöpfen über die volle Breite. */
@media (max-width: 700px) {
  .share-wrap { padding: 92px 12px 40px; }
  .share-head { grid-template-columns: minmax(0, 1fr); }
  .share-title { font-size: 25px; }
  .share-actions { justify-content: flex-start; }
  .share-actions .btn-m { flex: 1 1 auto; text-align: center; }
  .share-state { margin: 56px auto; }
}
@media (max-width: 480px) {
  .share-wrap { padding: 88px 8px 32px; }
  .share-title { font-size: 22px; }
}
</style>
<script src="../js/tu.js"></script>
</head>
<body>

<nav>
  <a href="../?home=true" class="nav-logo">
    <img src="../icon.png" alt="Inkwells Logo">
    <span>Inkwells</span>
  </a>
  <div class="nav-right">
    <!-- Beschriftung im <span>, damit die Regel für schmale Bildschirme sie
         ausblenden kann; ohne das quoll der Text aus dem runden Knopf. -->
    <a href="../" class="nav-dl" style="padding: 6px 14px; border-radius: 20px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;" title="Inkwells holen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none; flex-shrink:0;" class="dl-icon-mobile"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span data-i18n="share_get_inkwells">Inkwells holen</span>
    </a>
    <div class="lang-sw">
      <button class="lb active" data-tu-click="setLang('de')">DE</button>
      <button class="lb" data-tu-click="setLang('en')">EN</button>
      <button class="lb" data-tu-click="setLang('it')">IT</button>
    </div>
  </div>
</nav>

<div id="share-loading" class="share-state">
  <h2 data-i18n="share_loading_title">Heft wird geladen…</h2>
  <p data-i18n="share_loading_sub">Einen Moment bitte.</p>
</div>

<div id="share-error" class="share-state" style="display:none">
  <h2 id="share-error-title" data-i18n="share_gone_title">Diese Freigabe gibt es nicht mehr</h2>
  <p id="share-error-text" data-i18n="share_gone_text">Der Link ist ungültig oder wurde vom Besitzer aufgehoben.</p>
</div>

<div id="share-view" class="share-wrap">
  <div class="share-head">
    <div>
      <h1 id="share-title" class="share-title">Notizbuch</h1>
      <div id="share-meta" class="share-sub"></div>
    </div>
    <div class="share-actions">
      <span class="share-badge" id="share-role-badge" data-i18n="share_readonly">Nur lesen</span>
      <!-- Bearbeitet wird ausschließlich in der App: im Browser bleibt ein
           geteiltes Dokument immer schreibgeschützt. -->
      <a id="share-open-app" class="btn-m" style="display:none; padding:6px 12px; font-size:12px; text-decoration:none;" data-i18n="share_open_app">In Inkwells öffnen</a>
      <button id="share-pdf" class="btn-m" style="padding:6px 12px; font-size:12px;" data-i18n="dash_pdf">Als PDF</button>
    </div>
  </div>

  <!-- Hinweis für Empfänger mit Bearbeitungsrecht -->
  <p id="share-edit-hint" class="share-edit-hint" style="display:none"></p>

  <!-- Seiten werden 1:1 wie in der App gerendert (css/notebook.css) -->
  <div id="viewer-abschnitte" class="viewer-abschnitte" role="toolbar" hidden></div>
  <div id="viewer-pages" class="ink viewer-pages"></div>
</div>

<footer>
  <p>© 2026 Inkwells · Anvi</p>
  <div class="fl">
    <a href="https://github.com/manuel0anvi/Inkwells" target="_blank">GitHub</a>
    <a href="../community/" data-i18n="nav_community">Community</a>
    <a href="../datenschutz/" data-i18n="nav_datenschutz">Datenschutz</a>
  </div>
</footer>

<script src="../js/i18n.js"></script>
<!-- Dieselbe Seitendarstellung wie im Dashboard -->
<!-- Bereinigt fremden Seitentext, bevor er ins DOM geht. MUSS vor
     viewer.js stehen: dort wird sanitizePageHtml() aufgerufen. -->
<script src="../js/sanitize.js"></script>
<!-- Was außer Text und Handschrift auf einer Seite liegt: Formeln, Formen,
     Code-Kästen, PDF-Seiten. Dieselben Dateien wie in der App, erzeugt von
     npm run sync-share. MÜSSEN vor viewer.js stehen. -->
<script src="../lib/katex.min.js"></script>
<script src="../js/formula.js"></script>
<script src="../js/shapes.js"></script>
<script src="../js/code.js"></script>
<script src="../js/pdfSeiten.js"></script>
<script src="../js/inkSvg.js"></script>
<script src="../js/viewer.js"></script>
<!-- Export als PDF oder Word – dieselben Bausteine wie im Dashboard -->
<script src="../js/docx.js"></script>
<script src="../js/export-ui.js"></script>
<!-- Firestore-Zugriff; Modul, läuft nach den klassischen Scripts -->
<script type="module" src="../js/share.js"></script>

<script src="../js/seite-teilen.js"></script>
</body>
</html>
