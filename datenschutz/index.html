<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell — Datenschutz</title>

<link rel="icon" type="image/png" href="../icon.png">
<link rel="alternate icon" type="image/x-icon" href="../icon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Infant:ital,wght@0,300;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
  <a href="../?home=true" class="nav-logo">
    <img src="../icon.png" alt="Inkwell Logo">
    <span>Inkwell</span>
  </a>
  <div class="nav-right">
    <button id="btn-open-login" class="nav-dl" title="Web-App / Login" style="padding: 6px 12px; display: flex; align-items: center; gap: 8px; border-radius: 20px; cursor: pointer;">
      <svg class="nav-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <svg class="nav-icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display: none;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span data-i18n="nav_login">Anmelden</span>
    </button>
    <div class="lang-sw">
      <button class="lb active" onclick="setLang('de')">DE</button>
      <button class="lb" onclick="setLang('en')">EN</button>
      <button class="lb" onclick="setLang('it')">IT</button>
    </div>
    <div class="lang-sw-mobile-custom" style="display: none; position: relative;">
      <button id="lang-btn-mobile" onclick="toggleMobileLangMenu(event)" style="background: transparent; border: 0.5px solid var(--gold); color: var(--gold-light); font-family: 'Jost', sans-serif; font-size: 11px; padding: 6px 12px; text-transform: uppercase; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px; letter-spacing: 0.14em;">
        <span style="font-size: 11px; font-weight: 500; text-transform: uppercase; display: inline !important;">DE</span>
      </button>
      <div id="lang-dropdown-mobile" style="display: none; position: absolute; top: 42px; right: 0; background: var(--navy-card); border: 0.5px solid var(--navy-border); box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 4px; padding: 4px; z-index: 1000; min-width: 60px;">
        <button class="lb" onclick="setLang('de'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">DE</button>
        <button class="lb" onclick="setLang('en'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">EN</button>
        <button class="lb" onclick="setLang('it'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">IT</button>
      </div>
    </div>
  </div>
</nav>

<div class="page-container">
  <div class="page-header">
    <h1 class="page-title" id="privacy-title">Datenschutz</h1>
    <p class="page-subtitle" id="privacy-subtitle"></p>
    <p class="privacy-updated" id="privacy-updated"></p>
  </div>

  <!-- Kurzübersicht -->
  <div class="privacy-summary" id="privacy-summary"></div>

  <!-- Volltext, aus js/privacy-content.js gerendert -->
  <div class="privacy-content" id="privacy-content"></div>
</div>

<footer>
  <p>© 2026 Inkwell · Anvi</p>
  <div class="fl">
    <a href="https://github.com/manuel0anvi/Inkwell" target="_blank">GitHub</a>
    <a href="../community/" data-i18n="nav_community">Community</a>
    <a href="#" data-i18n="nav_datenschutz">Datenschutz</a>
  </div>
</footer>

<!-- Scripts -->
<script src="../js/i18n.js"></script>
<script src="../js/config.js"></script>
<script src="../js/providers.js"></script>
<script src="../js/common.js"></script>
<script src="../js/privacy-content.js"></script>
<script>
(function () {
  const el = (tag, cls) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    return node;
  };

  function renderSummary(data) {
    const box = document.getElementById('privacy-summary');
    box.innerHTML = '';

    const title = el('h2');
    title.textContent = data.summaryTitle;
    box.appendChild(title);

    const list = el('dl', 'privacy-summary-list');
    for (const [term, desc] of data.summary) {
      const dt = el('dt');
      dt.textContent = term;
      const dd = el('dd');
      dd.textContent = desc;
      list.append(dt, dd);
    }
    box.appendChild(list);
  }

  function renderSections(data) {
    const box = document.getElementById('privacy-content');
    box.innerHTML = '';

    for (const section of data.sections) {
      const wrap = el('section', 'privacy-section');

      const h = el('h2');
      h.textContent = section.h;
      wrap.appendChild(h);

      const addParagraphs = (list) => {
        for (const text of (list || [])) {
          const p = el('p');
          p.textContent = text;
          wrap.appendChild(p);
        }
      };

      addParagraphs(section.p);

      if (section.ul) {
        const ul = el('ul');
        for (const item of section.ul) {
          const li = el('li');
          // Nur <strong> aus dem eigenen Text – kein Fremdinhalt
          li.innerHTML = item;
          ul.appendChild(li);
        }
        wrap.appendChild(ul);
      }

      addParagraphs(section.p2);

      if (section.table) {
        const scroll = el('div', 'privacy-table-scroll');
        const table = el('table', 'privacy-table');

        const thead = el('thead');
        const headRow = el('tr');
        for (const head of section.table.head) {
          const th = el('th');
          th.textContent = head;
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = el('tbody');
        for (const row of section.table.rows) {
          const tr = el('tr');
          for (const cell of row) {
            const td = el('td');
            td.textContent = cell;
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        scroll.appendChild(table);
        wrap.appendChild(scroll);
      }

      if (section.links) {
        const list = el('ul', 'privacy-links');
        for (const link of section.links) {
          const li = el('li');
          const a = el('a');
          a.href = link.href;
          a.textContent = link.label;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          li.appendChild(a);
          list.appendChild(li);
        }
        wrap.appendChild(list);
      }

      if (section.note) {
        const note = el('p', 'privacy-note');
        note.textContent = section.note;
        wrap.appendChild(note);
      }

      box.appendChild(wrap);
    }
  }

  function renderPrivacy() {
    const data = PRIVACY[lang] || PRIVACY.de;

    document.getElementById('privacy-title').textContent = data.title;
    document.getElementById('privacy-subtitle').textContent = data.subtitle;

    const locale = lang === 'de' ? 'de-AT' : lang === 'it' ? 'it-IT' : 'en-GB';
    const updated = new Date(PRIVACY_UPDATED);
    document.getElementById('privacy-updated').textContent =
      `${data.updatedLabel}: ${updated.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric' })}`;

    document.documentElement.lang = lang;

    renderSummary(data);
    renderSections(data);
  }

  renderPrivacy();
  if (typeof addLangChangeListener === 'function') addLangChangeListener(renderPrivacy);
})();
</script>
</body>
</html>
