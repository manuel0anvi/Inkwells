<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Zweite Schicht unter js/sanitize.js: ein eingeschleustes
     <script src="https://fremd"> laeuft damit nicht. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://*.firebaseapp.com https://accounts.google.com https://login.microsoftonline.com; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwells — Datenschutz</title>

<link rel="icon" type="image/png" href="../icon.png">
<link rel="alternate icon" type="image/x-icon" href="../icon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Infant:ital,wght@0,300;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/tu.js"></script>
</head>
<body>

<nav>
  <a href="../?home=true" class="nav-logo">
    <img src="../icon.png" alt="Inkwells Logo">
    <span>Inkwells</span>
  </a>
  <div class="nav-right">
    <a href="../community/" class="nav-dl nav-community" title="Community">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span data-i18n="nav_community">Community</span>
    </a>
    <button id="btn-open-login" class="nav-dl" title="Web-App / Login" style="padding: 6px 12px; display: flex; align-items: center; gap: 8px; border-radius: 20px; cursor: pointer;">
      <svg class="nav-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <svg class="nav-icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display: none;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span data-i18n="nav_login">Anmelden</span>
    </button>
    <div class="lang-sw">
      <button class="lb active" data-tu-click="setLang('de')">DE</button>
      <button class="lb" data-tu-click="setLang('en')">EN</button>
      <button class="lb" data-tu-click="setLang('it')">IT</button>
    </div>
    <div class="lang-sw-mobile-custom" style="display: none; position: relative;">
      <button id="lang-btn-mobile" data-tu-click="toggleMobileLangMenu(event)" style="background: transparent; border: 0.5px solid var(--gold); color: var(--gold-light); font-family: 'Jost', sans-serif; font-size: 11px; padding: 6px 12px; text-transform: uppercase; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px; letter-spacing: 0.14em;">
        <span style="font-size: 11px; font-weight: 500; text-transform: uppercase; display: inline !important;">DE</span>
      </button>
      <div id="lang-dropdown-mobile" style="display: none; position: absolute; top: 42px; right: 0; background: var(--navy-card); border: 0.5px solid var(--navy-border); box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 4px; padding: 4px; z-index: 1000; min-width: 60px;">
        <button class="lb" data-tu-click="setLang('de'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">DE</button>
        <button class="lb" data-tu-click="setLang('en'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">EN</button>
        <button class="lb" data-tu-click="setLang('it'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">IT</button>
      </div>
    </div>
  </div>
</nav>

<div class="page-container">
  <div class="page-header">
    <h1 class="page-title" id="privacy-title">Datenschutz</h1>
    <p class="page-subtitle" id="privacy-subtitle"></p>
    <p class="privacy-updated" id="privacy-updated"></p>
  </div>

  <!-- Kurzübersicht -->
  <div class="privacy-summary" id="privacy-summary"></div>

  <!-- Volltext, aus js/privacy-content.js gerendert -->
  <div class="privacy-content" id="privacy-content"></div>
</div>

<footer>
  <p>© 2026 Inkwells · Anvi</p>
  <div class="fl">
    <a href="https://github.com/manuel0anvi/Inkwells" target="_blank">GitHub</a>
    <a href="../community/" data-i18n="nav_community">Community</a>
    <a href="#" data-i18n="nav_datenschutz">Datenschutz</a>
  </div>
</footer>

<!-- Scripts -->
<script src="../js/i18n.js"></script>
<script src="../js/config.js"></script>
<script src="../js/providers.js"></script>
<script src="../js/common.js"></script>
<script src="../js/privacy-content.js"></script>
<script src="../js/admin.js"></script>
<script type="module" src="../js/firebase.js"></script>
<script src="../js/seite-datenschutz.js"></script>
</body>
</html>
