<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell — Verwaltung</title>

<!-- Der Adminbereich gehört nicht in Suchergebnisse. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="../icon.png">
<link rel="alternate icon" type="image/x-icon" href="../icon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Infant:ital,wght@0,300;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<!-- Beiträge und Antworten sehen hier genauso aus wie im Forum. -->
<link rel="stylesheet" href="../css/forum.css">

<style>
/* Die Seite bleibt verborgen, bis feststeht, dass jemand angemeldet ist.
   Sonst blitzt der Adminbereich beim Neuladen kurz auf, während Firebase
   die gespeicherte Sitzung noch wiederherstellt. */
body[data-admin="pending"] .admin-page,
body[data-admin="no"] .admin-page { display: none; }

.admin-gate {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  font-family: 'Jost', sans-serif; font-size: 13px; color: var(--text-muted);
  letter-spacing: .08em; text-transform: uppercase;
}
body[data-admin="yes"] .admin-gate { display: none; }

/* Die Reiter sitzen in der Kopfzeile, links daneben steht das Logo wie
   auf allen anderen Seiten. */
.admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-tab {
  background: transparent; border: 0.5px solid var(--navy-border); color: var(--text-muted);
  font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; padding: 8px 14px; cursor: pointer; border-radius: 4px;
  transition: border-color .2s, color .2s, background .2s;
}
.admin-tab:hover { border-color: var(--gold); color: var(--gold-light); }
.admin-tab.active { border-color: var(--gold); color: var(--gold-light); background: var(--gold-dim); }

.admin-panel { display: none; }
.admin-panel.active { display: block; }

.admin-hint {
  font-size: 12px; color: var(--text-muted); line-height: 1.6;
  border-left: 2px solid var(--navy-border); padding-left: 12px; margin-bottom: 24px;
}

.admin-field { margin-bottom: 18px; }
.admin-field > label {
  display: block; font-family: 'Jost', sans-serif; font-size: 11px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--gold-light);
  margin-bottom: 6px;
}
.admin-field input, .admin-field textarea, .admin-field select {
  width: 100%; background: var(--navy-card); border: 0.5px solid var(--navy-border);
  color: var(--cream); font-family: 'Jost', sans-serif; font-weight: 300;
  font-size: 14px; padding: 10px 12px; border-radius: 4px; line-height: 1.6;
}
.admin-field textarea { resize: vertical; min-height: 80px; }
.admin-field input:focus, .admin-field textarea:focus, .admin-field select:focus {
  outline: none; border-color: var(--gold);
}

.admin-section-block {
  border: 0.5px solid var(--navy-border); border-radius: 6px;
  padding: 16px 18px; margin-bottom: 14px; background: rgba(21,23,36,0.5);
}

.admin-status { font-size: 13px; margin: 14px 0 0; min-height: 20px; }
.admin-status.ok { color: var(--gold-light); }
.admin-status.err { color: #d9534f; }

.admin-badge {
  display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  border: 0.5px solid var(--navy-border); color: var(--text-muted);
  padding: 4px 8px; border-radius: 3px; margin-top: 8px;
}
.admin-badge.on { border-color: var(--gold); color: var(--gold-light); }

.admin-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

/* Hinweiszeile über dem Antwortfeld: hier gibt es keine Namenswahl. */
.admin-as-note {
  font-size: 11px; letter-spacing: .06em; color: var(--gold-light);
  margin: 0 0 8px;
}

@media (max-width: 900px) {
  /* Auf schmalen Bildschirmen bricht die Kopfzeile um, statt die Reiter
     zusammenzuquetschen. */
  nav { flex-wrap: wrap; gap: 12px; padding: 14px 20px; }
  .admin-tab { padding: 7px 11px; font-size: 10px; letter-spacing: .08em; }
}
</style>
</head>
<body data-admin="pending">

<nav>
  <!-- Logo links wie überall. Der Klick führt aus dem Adminbereich
       hinaus – mit Rückfrage, damit das nicht versehentlich passiert. -->
  <a href="#" class="nav-logo" id="admin-exit-btn" title="Adminbereich verlassen">
    <img src="../icon.png" alt="Inkwell Logo">
    <span>Inkwell</span>
  </a>
  <div class="nav-right">
    <div class="admin-tabs">
      <button type="button" class="admin-tab active" data-panel="moderation" data-i18n="admin_tab_moderation">Community</button>
      <button type="button" class="admin-tab" data-panel="privacy" data-i18n="admin_tab_privacy">Datenschutz</button>
      <button type="button" class="admin-tab" data-panel="password" data-i18n="admin_tab_password">Passwort</button>
    </div>
    <div class="lang-sw">
      <button class="lb active" onclick="setLang('de')">DE</button>
      <button class="lb" onclick="setLang('en')">EN</button>
      <button class="lb" onclick="setLang('it')">IT</button>
    </div>
    <div class="lang-sw-mobile-custom" style="display: none; position: relative;">
      <button id="lang-btn-mobile" onclick="toggleMobileLangMenu(event)" style="background: transparent; border: 0.5px solid var(--gold); color: var(--gold-light); font-family: 'Jost', sans-serif; font-size: 11px; padding: 6px 12px; text-transform: uppercase; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px; letter-spacing: 0.14em;">
        <span style="font-size: 11px; font-weight: 500; text-transform: uppercase; display: inline !important;">DE</span>
      </button>
      <div id="lang-dropdown-mobile" style="display: none; position: absolute; top: 42px; right: 0; background: var(--navy-card); border: 0.5px solid var(--navy-border); box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 4px; padding: 4px; z-index: 1000; min-width: 60px;">
        <button class="lb" onclick="setLang('de'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">DE</button>
        <button class="lb" onclick="setLang('en'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">EN</button>
        <button class="lb" onclick="setLang('it'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">IT</button>
      </div>
    </div>
  </div>
</nav>

<div class="admin-gate" id="admin-gate">…</div>

<div class="admin-page">
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title" data-i18n="admin_page_title">Verwaltung</h1>
      <p class="page-subtitle" data-i18n="admin_page_sub">Angemeldet als Inkwell Team.</p>
    </div>

    <!-- ── Community ────────────────────────────────────────────────
         Gleiche Darstellung wie community/index.html (css/forum.css),
         zusätzlich mit Löschknöpfen. -->
    <section class="admin-panel active" id="panel-moderation">

      <button type="button" class="forum-new-btn" id="admin-new-post-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span data-i18n="admin_post_new">Neuer Beitrag</span>
      </button>

      <div id="admin-post-form-card" class="forum-form-card">
        <p class="admin-as-note" data-i18n="admin_post_as">Wird als „Inkwell Team“ veröffentlicht.</p>
        <form id="admin-new-post-form">
          <div class="forum-input-group">
            <div class="forum-input-header">
              <label for="admin-post-title" data-i18n="community_post_title">Titel</label>
              <span class="forum-char-counter" id="admin-post-title-counter"></span>
            </div>
            <input type="text" id="admin-post-title" maxlength="120" required>
          </div>

          <div class="forum-input-group">
            <label for="admin-post-type" data-i18n="community_post_type">Art des Beitrags</label>
            <select id="admin-post-type">
              <option value="question" data-i18n="community_type_question">Frage / Diskussion</option>
              <option value="bug" data-i18n="community_type_bug">Fehler melden (Bug)</option>
            </select>
          </div>

          <div class="forum-input-group">
            <div class="forum-input-header">
              <label for="admin-post-content" data-i18n="community_post_content">Nachricht</label>
              <span class="forum-char-counter" id="admin-post-content-counter"></span>
            </div>
            <textarea id="admin-post-content" rows="5" maxlength="2000" required></textarea>
          </div>

          <div style="display:flex; gap:12px; justify-content:flex-end;">
            <button type="button" class="btn-m" id="admin-post-cancel" data-i18n="downgrade_cancel">Abbrechen</button>
            <button type="submit" class="btn-m warn" id="admin-post-submit" data-i18n="admin_post_submit">Beitrag veröffentlichen</button>
          </div>
        </form>
      </div>

      <div class="forum-filter-bar">
        <button id="admin-filter-all" class="forum-filter-btn active" data-i18n="community_filter_all">Alle Beiträge</button>
        <button id="admin-filter-question" class="forum-filter-btn" data-i18n="community_filter_questions">Fragen &amp; Diskussionen</button>
        <button id="admin-filter-bug" class="forum-filter-btn" data-i18n="community_filter_bugs">Fehlerberichte</button>
      </div>

      <div style="margin-bottom:20px;">
        <button type="button" class="btn-m" id="admin-refresh" data-i18n="admin_mod_refresh">Neu laden</button>
      </div>

      <div id="admin-feed-list"></div>
    </section>

    <!-- ── Datenschutz ──────────────────────────────────────────────── -->
    <section class="admin-panel" id="panel-privacy">
      <p class="admin-hint" data-i18n="admin_privacy_hint"></p>

      <div class="admin-field">
        <label for="privacy-lang-select" data-i18n="admin_privacy_lang">Sprache</label>
        <select id="privacy-lang-select">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="it">Italiano</option>
        </select>
        <span class="admin-badge" id="privacy-source-badge"></span>
      </div>

      <div class="admin-field">
        <label for="privacy-updated-input" data-i18n="admin_privacy_updated">Stand (JJJJ-MM-TT)</label>
        <input type="text" id="privacy-updated-input" placeholder="2026-08-02" maxlength="10">
      </div>

      <div class="admin-field">
        <label for="privacy-title-input" data-i18n="admin_privacy_title_field">Überschrift</label>
        <input type="text" id="privacy-title-input" maxlength="120">
      </div>

      <div class="admin-field">
        <label for="privacy-subtitle-input" data-i18n="admin_privacy_subtitle">Unterzeile</label>
        <textarea id="privacy-subtitle-input" rows="2" maxlength="400"></textarea>
      </div>

      <div class="admin-field">
        <label data-i18n="admin_privacy_summary">Kurzübersicht</label>
        <div id="privacy-summary-fields"></div>
      </div>

      <div class="admin-field">
        <label data-i18n="admin_privacy_sections">Abschnitte</label>
        <div id="privacy-section-fields"></div>
      </div>

      <div class="admin-actions">
        <button type="button" class="btn-p" id="privacy-save" data-i18n="admin_privacy_save">Speichern</button>
        <button type="button" class="btn-m warn" id="privacy-reset" data-i18n="admin_privacy_reset">Auf Originaltext zurücksetzen</button>
      </div>
      <p class="admin-status" id="privacy-status"></p>
    </section>

    <!-- ── Passwort ─────────────────────────────────────────────────── -->
    <section class="admin-panel" id="panel-password">
      <form id="password-form" autocomplete="off" style="max-width:460px;">
        <div class="admin-field">
          <label for="pw-current" data-i18n="admin_pw_current">Aktuelles Passwort</label>
          <span class="pw-field"><input type="password" id="pw-current" required autocomplete="current-password"></span>
        </div>
        <div class="admin-field">
          <label for="pw-new" data-i18n="admin_pw_new">Neues Passwort</label>
          <span class="pw-field"><input type="password" id="pw-new" required minlength="8" autocomplete="new-password"></span>
        </div>
        <div class="admin-field">
          <label for="pw-repeat" data-i18n="admin_pw_repeat">Neues Passwort wiederholen</label>
          <span class="pw-field"><input type="password" id="pw-repeat" required minlength="8" autocomplete="new-password"></span>
        </div>
        <div class="admin-actions">
          <button type="submit" class="btn-p" id="pw-submit" data-i18n="admin_pw_submit">Passwort ändern</button>
        </div>
        <p class="admin-status" id="pw-status"></p>
      </form>
    </section>
  </div>

  <footer>
    <p>© 2026 Inkwell · Anvi</p>
    <div class="fl">
      <a href="../community/" data-i18n="nav_community">Community</a>
      <a href="../datenschutz/" data-i18n="nav_datenschutz">Datenschutz</a>
    </div>
  </footer>
</div>

<!-- Scripts -->
<script src="../js/i18n.js"></script>
<script src="../js/config.js"></script>
<!-- providers.js und common.js wegen des Sprachmenüs in der Kopfzeile
     (toggleMobileLangMenu) – dieselbe Reihenfolge wie auf den anderen
     Seiten. Die Anmeldelogik darin läuft hier ins Leere, weil es den
     Knopf "btn-open-login" auf dieser Seite nicht gibt. -->
<script src="../js/providers.js"></script>
<script src="../js/common.js"></script>
<script src="../js/privacy-content.js"></script>
<script src="../js/admin.js"></script>
<script type="module" src="../js/firebase.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   ADMINSEITE

   Alles hier ist Bedienoberfläche. Ob ein Löschen oder Speichern
   tatsächlich durchgeht, entscheidet Firestore anhand der angemeldeten
   Kennung (siehe website/firestore.rules). Wer diese Seite ohne gültige
   Anmeldung öffnet, sieht sie gar nicht erst – und käme selbst dann nicht
   an die Daten.

   Die Beitragsliste ist bewusst dieselbe Darstellung wie im Forum: gleiche
   Klassen, gleiche Stildatei (css/forum.css). Moderiert wird dort, wo man
   die Beiträge auch liest.
   ══════════════════════════════════════════════════════════════════════ */

let adminApi = null;
let posts = [];
let currentFilter = 'all';

/* Arbeitsfassung der Datenschutzerklärung, je Sprache. Wird beim ersten
   Öffnen des Reiters aus Firestore oder aus js/privacy-content.js befüllt. */
let privacyDraft = null;
let privacyUpdated = '';
let privacyFromDb = false;

function escapeHtml(text) {
  return String(text ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDate(value) {
  if (!value) return '';
  const date = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  const locale = lang === 'de' ? 'de-DE' : lang === 'it' ? 'it-IT' : 'en-GB';
  return date.toLocaleDateString(locale, {
    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

function showStatus(id, message, kind) {
  const node = document.getElementById(id);
  if (!node) return;
  node.textContent = message;
  node.className = 'admin-status' + (kind ? ' ' + kind : '');
}

/* ── Reiter ─────────────────────────────────────────────────────────── */

function switchPanel(name) {
  for (const tab of document.querySelectorAll('.admin-tab')) {
    tab.classList.toggle('active', tab.dataset.panel === name);
  }
  for (const panel of document.querySelectorAll('.admin-panel')) {
    panel.classList.toggle('active', panel.id === 'panel-' + name);
  }
  if (name === 'privacy' && !privacyDraft) loadPrivacyDraft();
}

/* ══════════════════════════════════════════════════════════════════════
   COMMUNITY
   ══════════════════════════════════════════════════════════════════════ */

function updateCounter(inputId, max) {
  const input = document.getElementById(inputId);
  const counter = document.getElementById(inputId + '-counter');
  if (!input || !counter) return;
  counter.textContent = tf('community_chars_left_of', {
    left: Math.max(0, max - (input.value || '').length),
    max
  });
}

function setFilter(filter) {
  currentFilter = filter;
  for (const btn of document.querySelectorAll('.forum-filter-btn')) {
    btn.classList.toggle('active', btn.id === 'admin-filter-' + filter);
  }
  renderFeed();
}

function toggleAdminPostForm() {
  const card = document.getElementById('admin-post-form-card');
  card.classList.toggle('open');
}

/* Antworten auf- und zuklappen. Die Liste startet zugeklappt, sonst wird
   die Seite bei vielen Antworten unübersichtlich lang. */
function toggleRepliesList(postId) {
  const list = document.getElementById('admin-replies-' + postId);
  const icon = document.getElementById('admin-replies-icon-' + postId);
  if (!list) return;

  const open = list.style.display !== 'none';
  list.style.display = open ? 'none' : 'flex';
  if (icon) icon.textContent = open ? '▼' : '▲';
}

function toggleReplyForm(postId) {
  const form = document.getElementById('admin-reply-form-' + postId);
  if (form) form.classList.toggle('open');
}

async function loadPosts() {
  const list = document.getElementById('admin-feed-list');
  list.innerHTML = `<div class="v-loading">${escapeHtml(t('admin_mod_loading'))}</div>`;

  try {
    posts = await adminApi.listPosts();
    renderFeed();
  } catch (err) {
    list.innerHTML = `<div class="forum-error">${escapeHtml(describeAdminError(err))}</div>`;
  }
}

function renderFeed() {
  const container = document.getElementById('admin-feed-list');
  const filtered = posts.filter(p => currentFilter === 'all' || p.type === currentFilter);

  if (!filtered.length) {
    container.innerHTML = `<div class="v-loading" style="border:0.5px solid var(--navy-border); background:var(--navy-card);">${escapeHtml(t('admin_mod_empty'))}</div>`;
    return;
  }

  container.innerHTML = filtered.map(post => {
    const badge = post.type === 'question' ? t('community_type_question') : t('community_type_bug');
    const replies = post.replies || [];

    const replyItems = replies.map(reply => `
      <div class="reply-item">
        <div class="reply-meta">
          <strong>${escapeHtml(reply.author)}</strong>
          <span>${escapeHtml(formatDate(reply.created_at))}</span>
          <button type="button" class="forum-del-btn" data-del-reply="${escapeHtml(post.id)}" data-reply-id="${escapeHtml(reply.id)}">${escapeHtml(t('admin_mod_delete_reply'))}</button>
        </div>
        <div class="reply-text">${escapeHtml(reply.content)}</div>
      </div>`).join('');

    return `
      <div class="post-item-card ${post.type}">
        <div class="post-meta-line">
          <span class="post-badge ${post.type}">${escapeHtml(badge)}</span>
          <span class="post-author-time">von <strong>${escapeHtml(post.author)}</strong> ${escapeHtml(formatDate(post.created_at))}</span>
          <button type="button" class="forum-del-btn" data-del-post="${escapeHtml(post.id)}">${escapeHtml(t('admin_mod_delete_post'))}</button>
        </div>
        <h3>${escapeHtml(post.title)}</h3>
        <div class="post-body-text">${escapeHtml(post.content)}</div>

        <div class="replies-section">
          <div class="replies-header">
            <span class="replies-title" style="cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:4px;" data-toggle-replies="${escapeHtml(post.id)}">
              ${replies.length} ${escapeHtml(t('admin_mod_replies'))}
              ${replies.length ? `<span id="admin-replies-icon-${escapeHtml(post.id)}">▼</span>` : ''}
            </span>
            <button type="button" class="reply-toggle-btn" data-toggle-reply-form="${escapeHtml(post.id)}">
              ${escapeHtml(t('admin_mod_reply_send'))}
            </button>
          </div>

          ${replies.length ? `<div id="admin-replies-${escapeHtml(post.id)}" style="display:none; flex-direction:column; gap:8px; margin-bottom:14px;">${replyItems}</div>` : ''}

          <form class="reply-form" id="admin-reply-form-${escapeHtml(post.id)}" data-reply-post="${escapeHtml(post.id)}">
            <p class="admin-as-note">${escapeHtml(t('admin_mod_reply_as'))}</p>
            <div class="forum-input-group" style="margin:0;">
              <textarea class="admin-reply-text" rows="2" maxlength="500" required placeholder="${escapeHtml(t('community_add_reply'))}"></textarea>
            </div>
            <button type="submit" class="reply-submit-btn">${escapeHtml(t('admin_mod_reply_send'))}</button>
          </form>
        </div>
      </div>`;
  }).join('');
}

/* Ein einziger Zuhörer für die ganze Liste statt einer je Knopf: die Liste
   wird bei jedem Laden neu gebaut, einzeln angehängte Zuhörer müssten
   jedes Mal mit aufgeräumt werden. */
document.getElementById('admin-feed-list').addEventListener('click', (event) => {
  const target = event.target.closest('[data-del-post], [data-del-reply], [data-toggle-replies], [data-toggle-reply-form]');
  if (!target) return;

  if (target.dataset.delPost) removePost(target.dataset.delPost);
  else if (target.dataset.delReply) removeReply(target.dataset.delReply, target.dataset.replyId);
  else if (target.dataset.toggleReplies) toggleRepliesList(target.dataset.toggleReplies);
  else if (target.dataset.toggleReplyForm) toggleReplyForm(target.dataset.toggleReplyForm);
});

document.getElementById('admin-feed-list').addEventListener('submit', async (event) => {
  const form = event.target.closest('[data-reply-post]');
  if (!form) return;
  event.preventDefault();

  const postId = form.dataset.replyPost;
  const textarea = form.querySelector('.admin-reply-text');
  const button = form.querySelector('.reply-submit-btn');
  const content = textarea.value.trim();
  if (!content) return;

  button.disabled = true;
  try {
    await adminApi.createReply(postId, { author: ADMIN_DISPLAY_NAME, content });
    textarea.value = '';
    await loadPosts();
  } catch (err) {
    alert(describeAdminError(err));
  } finally {
    button.disabled = false;
  }
});

async function handleCreatePost(event) {
  event.preventDefault();

  const title = document.getElementById('admin-post-title').value.trim();
  const type = document.getElementById('admin-post-type').value;
  const content = document.getElementById('admin-post-content').value.trim();
  if (!title || !content) return;

  const button = document.getElementById('admin-post-submit');
  button.disabled = true;

  try {
    await adminApi.createPost({ type, title, content, author: ADMIN_DISPLAY_NAME });
    document.getElementById('admin-new-post-form').reset();
    updateCounter('admin-post-title', 120);
    updateCounter('admin-post-content', 2000);
    toggleAdminPostForm();
    await loadPosts();
  } catch (err) {
    alert(describeAdminError(err));
  } finally {
    button.disabled = false;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   DATENSCHUTZERKLÄRUNG

   Bearbeitet werden Überschriften, Absätze und die Kurzübersicht. Listen,
   Tabellen und Verweise bleiben unangetastet: sie stecken in der Struktur
   aus js/privacy-content.js und werden beim Speichern unverändert
   mitgeschrieben. So kann man den Text pflegen, ohne den Aufbau der Seite
   versehentlich zu zerlegen.
   ══════════════════════════════════════════════════════════════════════ */

function updatePrivacyBadge() {
  const badge = document.getElementById('privacy-source-badge');
  if (!badge) return;
  badge.textContent = privacyFromDb ? t('admin_privacy_edited') : t('admin_privacy_original');
  badge.classList.toggle('on', privacyFromDb);
}

async function loadPrivacyDraft() {
  try {
    const stored = await adminApi.loadPrivacy();
    if (stored) {
      privacyDraft = stored.content;
      privacyUpdated = stored.updated || PRIVACY_UPDATED;
      privacyFromDb = true;
    } else {
      // Tiefe Kopie, damit das Original im Script unberührt bleibt
      privacyDraft = JSON.parse(JSON.stringify(PRIVACY));
      privacyUpdated = PRIVACY_UPDATED;
      privacyFromDb = false;
    }
  } catch (err) {
    privacyDraft = JSON.parse(JSON.stringify(PRIVACY));
    privacyUpdated = PRIVACY_UPDATED;
    privacyFromDb = false;
    showStatus('privacy-status', describeAdminError(err), 'err');
  }

  updatePrivacyBadge();
  renderPrivacyEditor();
}

function currentPrivacyLang() {
  return document.getElementById('privacy-lang-select').value;
}

function renderPrivacyEditor() {
  if (!privacyDraft) return;

  const data = privacyDraft[currentPrivacyLang()] || privacyDraft.de;

  /* Überschrift, Unterzeile und Datum schreiben ihre Änderung sofort in die
     Arbeitsfassung. Würden sie erst beim Speichern ausgelesen, wären sie
     beim Wechsel der Sprache verloren – renderPrivacyEditor() überschreibt
     die Felder dann ja mit dem Text der anderen Sprache.

     Zuweisung an .oninput statt addEventListener: die drei Felder stehen
     fest im Dokument, und bei jedem Aufbau käme sonst ein weiterer
     Zuhörer obendrauf. */
  const updatedInput = document.getElementById('privacy-updated-input');
  const titleInput = document.getElementById('privacy-title-input');
  const subtitleInput = document.getElementById('privacy-subtitle-input');

  updatedInput.value = privacyUpdated || '';
  titleInput.value = data.title || '';
  subtitleInput.value = data.subtitle || '';

  updatedInput.oninput = () => { privacyUpdated = updatedInput.value.trim(); };
  titleInput.oninput = () => { data.title = titleInput.value; };
  subtitleInput.oninput = () => { data.subtitle = subtitleInput.value; };

  // Kurzübersicht: Paare aus Begriff und Erklärung
  const summaryBox = document.getElementById('privacy-summary-fields');
  summaryBox.textContent = '';
  (data.summary || []).forEach((pair, index) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:grid; grid-template-columns:minmax(120px,1fr) 2fr; gap:10px; margin-bottom:8px;';

    const term = document.createElement('input');
    term.type = 'text';
    term.value = pair[0] || '';
    term.addEventListener('input', () => { data.summary[index][0] = term.value; });

    const desc = document.createElement('input');
    desc.type = 'text';
    desc.value = pair[1] || '';
    desc.addEventListener('input', () => { data.summary[index][1] = desc.value; });

    row.append(term, desc);
    summaryBox.appendChild(row);
  });

  // Abschnitte
  const sectionBox = document.getElementById('privacy-section-fields');
  sectionBox.textContent = '';
  (data.sections || []).forEach((section) => {
    const block = document.createElement('div');
    block.className = 'admin-section-block';

    const headingField = document.createElement('div');
    headingField.className = 'admin-field';
    const headingLabel = document.createElement('label');
    headingLabel.textContent = t('admin_privacy_section_heading');
    const headingInput = document.createElement('input');
    headingInput.type = 'text';
    headingInput.value = section.h || '';
    headingInput.addEventListener('input', () => { section.h = headingInput.value; });
    headingField.append(headingLabel, headingInput);
    block.appendChild(headingField);

    /* Absätze stehen im Datenmodell als Liste. Im Formular sind sie ein
       einziges Feld, in dem eine Leerzeile zwei Absätze trennt – das
       tippt sich weit angenehmer als ein Feld je Absatz. */
    const makeParagraphField = (key) => {
      if (!Array.isArray(section[key])) return;

      const field = document.createElement('div');
      field.className = 'admin-field';
      const label = document.createElement('label');
      label.textContent = t('admin_privacy_paragraphs');
      const area = document.createElement('textarea');
      area.rows = Math.min(10, Math.max(3, section[key].length * 2));
      area.value = section[key].join('\n\n');
      area.addEventListener('input', () => {
        section[key] = area.value.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
      });
      field.append(label, area);
      block.appendChild(field);
    };

    makeParagraphField('p');
    makeParagraphField('p2');

    if (typeof section.note === 'string') {
      const noteField = document.createElement('div');
      noteField.className = 'admin-field';
      noteField.style.marginBottom = '0';
      const noteLabel = document.createElement('label');
      noteLabel.textContent = t('admin_privacy_note');
      const noteArea = document.createElement('textarea');
      noteArea.rows = 2;
      noteArea.value = section.note;
      noteArea.addEventListener('input', () => { section.note = noteArea.value; });
      noteField.append(noteLabel, noteArea);
      block.appendChild(noteField);
    }

    sectionBox.appendChild(block);
  });
}

async function savePrivacyDraft() {
  // Alle Felder schreiben schon beim Tippen in privacyDraft – hier ist
  // deshalb nichts mehr einzusammeln.
  if (!/^\d{4}-\d{2}-\d{2}$/.test(privacyUpdated)) {
    showStatus('privacy-status', t('admin_privacy_date_invalid'), 'err');
    return;
  }

  const button = document.getElementById('privacy-save');
  button.disabled = true;
  try {
    await adminApi.savePrivacy(privacyDraft, privacyUpdated);
    privacyFromDb = true;
    updatePrivacyBadge();
    showStatus('privacy-status', t('admin_privacy_saved'), 'ok');
  } catch (err) {
    showStatus('privacy-status', describeAdminError(err), 'err');
  } finally {
    button.disabled = false;
  }
}

async function resetPrivacyDraft() {
  const ok = await askConfirm({
    title: t('admin_privacy_reset_title'),
    body: t('admin_privacy_reset_body'),
    confirm: t('admin_privacy_reset_confirm'),
    danger: true
  });
  if (!ok) return;

  try {
    await adminApi.resetPrivacy();
    privacyDraft = null;
    await loadPrivacyDraft();
    showStatus('privacy-status', t('admin_privacy_saved'), 'ok');
  } catch (err) {
    showStatus('privacy-status', describeAdminError(err), 'err');
  }
}

/* ══════════════════════════════════════════════════════════════════════
   PASSWORT
   ══════════════════════════════════════════════════════════════════════ */

async function handlePasswordChange(event) {
  event.preventDefault();

  const current = document.getElementById('pw-current').value;
  const next = document.getElementById('pw-new').value;
  const repeat = document.getElementById('pw-repeat').value;

  if (next !== repeat) {
    showStatus('pw-status', t('admin_pw_mismatch'), 'err');
    return;
  }
  if (next.length < 8) {
    showStatus('pw-status', t('admin_pw_short'), 'err');
    return;
  }

  const button = document.getElementById('pw-submit');
  button.disabled = true;
  showStatus('pw-status', '', '');

  try {
    await adminApi.adminChangePassword(current, next);
    document.getElementById('password-form').reset();
    showStatus('pw-status', t('admin_pw_changed'), 'ok');
  } catch (err) {
    showStatus('pw-status', describeAdminError(err), 'err');
  } finally {
    button.disabled = false;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   VERLASSEN

   Der Weg hinaus führt über das Logo oben links – mit Rückfrage, damit
   ein versehentlicher Klick nicht die Sitzung beendet.
   ══════════════════════════════════════════════════════════════════════ */

async function exitAdmin(event) {
  if (event) event.preventDefault();

  const ok = await askConfirm({
    title: t('admin_exit_title'),
    body: t('admin_exit_body'),
    confirm: t('admin_exit_confirm')
  });
  if (!ok) return;

  try {
    await adminApi.adminSignOut();
  } catch (err) {
    console.warn('[Admin] Abmelden:', err);
  }
  window.location.replace('../?home=true');
}

/* Beim Sprachwechsel erneuern sich die festen Texte über data-i18n von
   selbst (js/i18n.js). Was hier erzeugt wurde, muss neu gezeichnet
   werden – Beitragsliste, Zähler und der Datenschutz-Editor. */
if (typeof addLangChangeListener === 'function') {

    updateCounter('admin-post-content', 2000);

}

(async () => {
  document.getElementById('admin-gate').textContent = '…';
  setupPasswordEyes();
  updateCounter('admin-post-title', 120);
  updateCounter('admin-post-content', 2000);

  try {
    adminApi = await whenAdminApiReady();
  } catch (err) {
    document.getElementById('admin-gate').textContent = describeAdminError(err);
    document.body.dataset.admin = 'no';
    return;
  }

  const signedIn = await adminApi.adminReady();
  if (!signedIn) {
    // Kein Hinweis, keine Verzögerung: wer hier nichts zu suchen hat, soll
    // nicht einmal erfahren, dass es die Seite gibt.
    window.location.replace('../');
    return;
  }

  document.body.dataset.admin = 'yes';
  document.title = 'Inkwell — ' + t('admin_page_title');
  loadPosts();

  // Wird die Sitzung anderswo beendet (etwa in einem zweiten Tab),
  // schließt sich der Adminbereich auch hier.
  adminApi.onAdminChange((stillAdmin) => {
    if (!stillAdmin) window.location.replace('../');
  });
})();
</script>
