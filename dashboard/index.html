<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell — Dashboard</title>

<link rel="icon" type="image/png" href="../icon.png">
<link rel="alternate icon" type="image/x-icon" href="../icon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Crimson Pro + DM Mono werden für die App-identische Seitendarstellung gebraucht -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Infant:ital,wght@0,300;1,300&family=Jost:wght@300;400;500&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/notebook.css">
<style>
/* ── Volltextsuche über alle Hefte ──────────────────────────────────
   Gegenstück zu src/ui/search.js + .home-search in src/css/modals.css.
   Gleiches Verhalten wie in der App, nur in den Farben der Website.
   ─────────────────────────────────────────────────────────────────── */
.dash-search {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 28px;
}
.dash-search-icon {
  position: absolute;
  left: 14px;
  color: var(--text-muted);
  pointer-events: none;
}
.dash-search input {
  width: 100%;
  padding: 11px 40px;
  background: var(--navy-card);
  border: 0.5px solid var(--navy-border);
  border-radius: 8px;
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color .15s;
}
.dash-search input:focus { border-color: var(--gold); }
.dash-search input::placeholder { color: var(--text-muted); }
.dash-search input::-webkit-search-cancel-button { display: none; }
.dash-search-clear {
  position: absolute;
  right: 10px;
  background: none;
  border: 0;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 4px 6px;
  line-height: 1;
}
.dash-search-clear:hover { color: var(--cream); }

/* ── Reiter: eigene Hefte / geteilte Dokumente ──────────────────────── */
.dash-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  border-bottom: 0.5px solid var(--navy-border);
}
.dash-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 8px 4px;
  cursor: pointer;
  color: var(--text-muted);
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: color .15s, border-color .15s;
}
.dash-tab:hover { color: var(--cream); }
.dash-tab.active { color: var(--gold-light); border-bottom-color: var(--gold); }
.dash-tab-count {
  min-width: 16px;
  padding: 1px 5px;
  border-radius: 8px;
  background: var(--gold);
  color: #16202e;
  font-size: 9px;
  line-height: 14px;
  text-align: center;
}

/* Abzeichen auf der Karte eines geteilten Dokuments */
.nb-card-role {
  display: inline-block;
  margin-top: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 0.5px solid var(--navy-border);
  color: var(--text-muted);
}
.nb-card-role.can-edit { border-color: rgba(224,166,58,.5); color: var(--gold-light); }

/* ── Personenliste im Freigabe-Dialog ─────────────────────────────────
   Eingeladene und über den Link Dazugekommene gemischt.
   ─────────────────────────────────────────────────────────────────── */
.share-people { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
.share-person {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: rgba(0,0,0,0.22);
  border: 0.5px solid var(--navy-border);
  border-radius: 6px;
  font-family: 'Jost', sans-serif;
}
.share-person-mail {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12px;
  color: var(--cream);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.share-person-via {
  flex: none;
  font-size: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.share-person select {
  flex: none;
  padding: 4px 6px;
  background: rgba(0,0,0,0.3);
  border: 0.5px solid var(--navy-border);
  border-radius: 5px;
  color: var(--cream);
  font-family: inherit;
  font-size: 11px;
}
.share-person-remove {
  flex: none;
  background: none;
  border: 0;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px;
}
.share-person-remove:hover { color: #d9534f; }
.share-people-empty { font-size: 11px; color: var(--text-muted); line-height: 1.6; margin: 0; }
.share-person.blocked .share-person-mail { text-decoration: line-through; opacity: .6; }

.search-count {
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.search-empty {
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  color: var(--text-muted);
  padding: 20px 0;
}
.search-hit {
  display: flex;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: var(--navy-card);
  border: 0.5px solid var(--navy-border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
  color: inherit;
  font: inherit;
  transition: border-color .12s, transform .12s;
}
.search-hit:hover { border-color: var(--gold); transform: translateX(2px); }
.search-hit-dot { width: 4px; border-radius: 2px; flex-shrink: 0; }
.search-hit-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.search-hit-title {
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  letter-spacing: .05em;
  color: var(--gold-light);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.search-hit-snippet {
  font-family: 'Jost', sans-serif;
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.5;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.search-hit-snippet mark {
  background: rgba(201, 162, 39, .28);
  color: var(--cream);
  border-radius: 2px;
  padding: 0 1px;
}

/* Kurzes Aufleuchten der angesprungenen Seite, damit man sie im
   Seitenstapel sofort findet. */
@keyframes dash-page-flash {
  from { box-shadow: 0 0 0 3px var(--gold); }
  to   { box-shadow: 0 0 0 3px rgba(201, 162, 39, 0); }
}
.j-page-scaler.search-target { animation: dash-page-flash 1.6s ease-out; }
</style>
</head>
<body>

<nav>
  <a href="../?home=true" class="nav-logo">
    <img src="../icon.png" alt="Inkwell Logo">
    <span>Inkwell</span>
  </a>
  <div class="nav-right">
    <a href="../community/" class="nav-dl nav-community" title="Community">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span data-i18n="nav_community">Community</span>
    </a>
    <button id="btn-open-login" class="nav-dl" title="Zur Startseite" style="padding: 6px 12px; display: flex; align-items: center; gap: 8px; border-radius: 20px; cursor: pointer;">
      <svg class="nav-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display: none;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <svg class="nav-icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span data-i18n="dash_home">Zur Startseite</span>
    </button>
    <div class="lang-sw">
      <button class="lb active" onclick="setLang('de')">DE</button>
      <button class="lb" onclick="setLang('en')">EN</button>
      <button class="lb" onclick="setLang('it')">IT</button>
    </div>
    <div class="lang-sw-mobile-custom" style="display: none; position: relative;">
      <button id="lang-btn-mobile" onclick="toggleMobileLangMenu(event)" style="background: transparent; border: 0.5px solid var(--gold); color: var(--gold-light); font-family: 'Jost', sans-serif; font-size: 11px; padding: 6px 12px; text-transform: uppercase; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 36px; letter-spacing: 0.14em;">
        <span style="font-size: 11px; font-weight: 500; text-transform: uppercase; display: inline !important;">DE</span>
      </button>
      <div id="lang-dropdown-mobile" style="display: none; position: absolute; top: 42px; right: 0; background: var(--navy-card); border: 0.5px solid var(--navy-border); box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 4px; padding: 4px; z-index: 1000; min-width: 60px;">
        <button class="lb" onclick="setLang('de'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">DE</button>
        <button class="lb" onclick="setLang('en'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">EN</button>
        <button class="lb" onclick="setLang('it'); toggleMobileLangMenu()" style="display: block; width: 100%; text-align: center; padding: 8px 12px;">IT</button>
      </div>
    </div>
  </div>
</nav>

<!-- Web App Dashboard -->
<div id="webapp-dashboard" class="dash-wrap" style="display: block;">
  <div class="dash-head">
    <div class="dash-head-title">
      <h2 data-i18n="dash_title">Meine Notebooks</h2>
      <div id="last-sync-time"></div>
    </div>
    <div class="dash-head-actions">
      <div id="drive-connected-indicator">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="drive-connected-label">Google Drive</span>
      </div>
      <button id="logout-btn" class="btn-m" style="color: #d9534f; border-color: rgba(217,83,79,0.3);" data-i18n="dash_logout">Abmelden</button>
    </div>
  </div>
  <!-- Speicherbelegung des Google-Kontos -->
  <div id="storage-info" style="display:none; margin-bottom:32px; padding:16px 20px; border:0.5px solid var(--navy-border); border-radius:8px; background:var(--navy-card); font-family:'Jost',sans-serif;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:10px;">
      <span style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-light);" data-i18n="dash_storage_title">Cloud-Speicher</span>
      <span id="storage-text" style="font-size:13px; color:var(--text-body);"></span>
    </div>
    <div id="storage-track" style="width:100%; height:6px; background:rgba(0,0,0,0.3); border-radius:3px; overflow:hidden;">
      <div id="storage-bar" style="width:0%; height:100%; background:var(--gold); transition:width .3s;"></div>
    </div>
    <div id="storage-own" style="font-size:12px; color:var(--text-muted); margin-top:8px;"></div>
  </div>

  <!-- Volltextsuche über Heftnamen, Abschnitte und Seitentext -->
  <div class="dash-search">
    <svg class="dash-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="search" id="dash-search-input" data-i18n-ph="dash_search_placeholder"
           placeholder="In allen Heften suchen…" autocomplete="off" spellcheck="false">
    <button class="dash-search-clear" id="dash-search-clear" title="Leeren" style="display:none">✕</button>
  </div>

  <!-- Eigene Hefte und geteilte Dokumente. Der Zähler am zweiten Reiter
       zeigt, was seit dem letzten Besuch dazugekommen ist. -->
  <div class="dash-tabs">
    <button class="dash-tab active" id="dash-tab-own" data-i18n="dash_tab_own">Meine Hefte</button>
    <button class="dash-tab" id="dash-tab-shared">
      <span data-i18n="dash_tab_shared">Geteilte Dokumente</span>
      <span class="dash-tab-count" id="dash-shared-count" style="display:none">0</span>
    </button>
  </div>

  <!-- Karten werden 1:1 wie im App-Startbildschirm gerendert (css/notebook.css) -->
  <div id="dashboard-grid" class="ink nb-grid"></div>
  <div id="dashboard-search-results" style="display:none"></div>

  <div id="dashboard-shared" style="display:none">
    <div id="shared-grid" class="ink nb-grid"></div>
    <p id="shared-hint" style="font-family:'Jost',sans-serif; font-size:12px; line-height:1.7; color:var(--text-muted); margin:0 0 24px;"></p>
  </div>
</div>

<!-- Web App Viewer -->
<div id="webapp-viewer" class="viewer-wrap" style="display: none;">
  <div class="viewer-bar">
    <button id="viewer-back" type="button" aria-label="Zurück zur Übersicht" title="Zurück zur Übersicht">←</button>
    <h3 id="viewer-title">Notebook</h3>
    <div class="viewer-bar-actions">
      <span id="viewer-page-num-top">0 Seiten</span>
      <button id="viewer-share" class="btn-m" data-i18n="dash_share">Freigeben</button>
      <button id="viewer-pdf" class="btn-m" data-i18n="dash_pdf">Exportieren</button>
    </div>
  </div>
  <!-- Seiten werden 1:1 wie in der App gerendert (css/notebook.css) -->
  <div id="viewer-pages" class="ink viewer-pages"></div>
</div>

<!-- Freigabe-Dialog -->
<div id="share-overlay" class="web-dialog-backdrop" style="display:none;">
  <div class="web-dialog">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:14px;">
      <h3 id="share-dlg-title" style="font-family:'Cormorant Garamond',serif; font-size:26px; font-style:italic; color:var(--gold-light); margin:0;">Heft freigeben</h3>
      <button id="share-dlg-close" style="background:none; border:0; color:var(--text-muted); font-size:18px; cursor:pointer; line-height:1;">✕</button>
    </div>

    <p id="share-dlg-intro" style="font-size:13px; color:var(--text-body); line-height:1.6; margin:0 0 18px;"></p>

    <p id="share-dlg-needs-account" style="display:none; font-size:12px; color:var(--text-muted); line-height:1.6; border:0.5px solid rgba(224,166,58,0.3); background:rgba(224,166,58,0.07); border-radius:6px; padding:10px; margin:0 0 16px;"></p>

    <div style="margin-bottom:16px;" id="share-dlg-link-section">
      <!-- Ein Schalter und daneben dieselbe Rollenauswahl wie bei den
           Personen darunter. Vorher standen hier drei Auswahlpunkte –
           dieselbe Frage in anderer Form, zweimal zu lernen. -->
      <div class="share-link-head">
        <label class="share-link-toggle">
          <input type="checkbox" id="share-dlg-link-on">
          <span data-i18n="share_link_anyone">Jeder mit dem Link</span>
        </label>
        <select id="share-dlg-link-role" class="share-role-select" disabled>
          <option value="view" data-i18n="role_view">Nur lesen</option>
          <option value="edit" data-i18n="role_edit">Bearbeiten</option>
        </select>
      </div>
    </div>

    <div id="share-dlg-link-row" style="display:none; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
      <input id="share-dlg-link" type="text" readonly style="flex:1 1 180px; min-width:0; padding:9px 12px; background:rgba(0,0,0,0.28); border:0.5px solid var(--navy-border); border-radius:5px; color:var(--cream); font-family:'Jost',sans-serif; font-size:12px;">
      <button id="share-dlg-copy" class="btn-m" style="padding:8px 14px; font-size:12px; white-space:nowrap;" data-i18n="share_copy">Link kopieren</button>
      <button id="share-dlg-renew" class="btn-m" style="padding:8px 14px; font-size:12px; white-space:nowrap;" data-i18n="share_renew_link">Link erneuern</button>
    </div>

    <div style="margin-bottom:16px;" id="share-dlg-people-section">
      <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-light); margin-bottom:10px;" data-i18n="share_invite_label">Bestimmte Personen</div>

      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
        <input id="share-dlg-mail" type="email" autocomplete="off" spellcheck="false" placeholder="name@example.com"
               data-i18n-ph="share_invite_placeholder"
               style="flex:1 1 180px; min-width:0; padding:9px 12px; background:rgba(0,0,0,0.28); border:0.5px solid var(--navy-border); border-radius:5px; color:var(--cream); font-family:'Jost',sans-serif; font-size:12px;">
        <select id="share-dlg-role" class="share-role-select" style="padding:9px 30px 9px 12px;">
          <option value="view" data-i18n="role_view">Nur lesen</option>
          <option value="edit" data-i18n="role_edit">Bearbeiten</option>
        </select>
        <button id="share-dlg-add" class="btn-m" style="padding:8px 14px; font-size:12px;" data-i18n="share_invite_add">Hinzufügen</button>
      </div>

      <!-- Eingeladene und über den Link Dazugekommene stehen gemischt in
           einer Liste. Sonst könnte man genau die Leute nicht entfernen,
           die man nie eingeladen hat. -->
      <div id="share-dlg-people" class="share-people"></div>
    </div>

    <p id="share-dlg-warning" style="font-size:11px; color:var(--text-muted); line-height:1.5; border:0.5px solid rgba(224,166,58,0.3); background:rgba(224,166,58,0.07); border-radius:6px; padding:10px; margin:0 0 16px;"></p>

    <div id="share-dlg-status" style="font-size:12px; color:var(--gold-light); min-height:18px; margin-bottom:14px;"></div>

    <!-- „Link erzeugen" und „Freigabe aktualisieren" gibt es nicht mehr:
         der Schalter oben und das Hinzufügen einer Adresse wirken
         unmittelbar. Nur das Aufheben bleibt ein eigener Knopf – es ist
         der einzige Schritt hier, der etwas wegnimmt. -->
    <div class="web-dialog-actions">
      <button id="share-dlg-revoke" class="btn-m" style="display:none; padding:8px 16px; font-size:12px; color:#d9534f; border-color:rgba(217,83,79,0.35);" data-i18n="share_revoke">Freigabe aufheben</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Inkwell · Anvi</p>
  <div class="fl">
    <a href="https://github.com/manuel0anvi/Inkwell" target="_blank">GitHub</a>
    <a href="../community/" data-i18n="nav_community">Community</a>
    <a href="../datenschutz/" data-i18n="nav_datenschutz">Datenschutz</a>
  </div>
</footer>

<!-- Scripts -->
<script src="../js/i18n.js"></script>
<!-- Seitendarstellung – teilt sich die Freigabe-Seite (s/) mit dem Dashboard -->
<script src="../js/viewer.js"></script>
<script src="../js/config.js"></script>
<script src="../js/providers.js"></script>
<script src="../js/common.js"></script>
<!-- Word-Export und der Dialog, der Format und Seitenumfang auswählt.
     Beides teilt sich die Freigabe-Seite (s/) mit dem Dashboard. -->
<script src="../js/docx.js"></script>
<script src="../js/export-ui.js"></script>
<!-- Freigabe über Firestore; Modul, läuft nach den klassischen Scripts -->
<script type="module" src="../js/share.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
